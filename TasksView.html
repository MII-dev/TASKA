        <div id="tasksViewContainer">
            <div class="layout-grid">
                <div class="tasks-area">
                    <div id="aiSetupBanner" class="ai-setup-banner" style="display: none;">
                        <h4>🔑 Налаштування ШІ-асистента</h4>
                        <p style="font-size: 0.85rem; color: var(--text-main); margin-bottom: 0.5rem;">
                            Для використання інтелектуальних функцій (чат, автозаповнення, кроки) додайте ваш
                            <strong>Gemini
                                API Key</strong>.
                            Отримати безкоштовний ключ можна в <a href="https://aistudio.google.com/apikey"
                                target="_blank" style="color: var(--status-new-text); text-decoration: underline;">Google AI
                                Studio</a>.
                        </p>
                        <div class="ai-setup-input-group">
                            <input type="password" id="aiApiKeyInput" class="search-input"
                                placeholder="Введіть API ключ (AIzaSy...)" style="margin-bottom: 0;">
                            <button class="btn btn-primary" onclick="saveApiKey()"
                                style="padding: 0.5rem 1rem;">Зберегти</button>
                        </div>
                    </div>
                    <div class="controls">
                        <input type="text" class="search-input" id="searchInput" placeholder="Пошук задач..."
                            oninput="filterTasks()">
                        <select class="search-input" style="flex: 0 1 auto; min-width: 140px;" id="statusFilter"
                            onchange="filterTasks()">
                            <option value="active">Активні</option>
                            <option value="all">Усі статуси</option>
                            <option value="Нова">Нова</option>
                            <option value="В роботі">В роботі</option>
                            <option value="На перевірці">На перевірці</option>
                            <option value="Виконано">Виконано</option>
                        </select>
                        <select class="search-input" style="flex: 0 1 auto; min-width: 160px;" id="sortFilter"
                            onchange="filterTasks()">
                            <option value="default">Сортування: Замовчуванням</option>
                            <option value="deadline">За найближчим дедлайном</option>
                            <option value="priority">За пріоритетом</option>
                            <option value="newest">Найновіші</option>
                        </select>
                        <div style="display: flex; gap: 0.5rem; flex: 0 0 auto;">
                            <button class="btn btn-outline" id="btnListView" onclick="setViewMode('list')"
                                style="padding: 0.5rem 0.75rem; background: var(--bg-card-hover);">📋 Список</button>
                            <button class="btn btn-outline" id="btnKanbanView" onclick="setViewMode('kanban')"
                                style="padding: 0.5rem 0.75rem;">🗂️ Дошка</button>
                        </div>
                    </div>

                    <div id="taskList" class="task-list">
                        <!-- Tasks will be loaded here -->
                        <div class="empty-state" style="grid-column: 1 / -1; border: none; background: transparent;">
                            <div class="loader"></div>
                            <h3 style="margin-top: 1.5rem;">Завантаження...</h3>
                        </div>
                    </div>

                    <div id="kanbanBoard" class="kanban-board" style="display: none;">
                        <!-- Kanban Columns will be generated by JS -->
                    </div>
                </div>

                <aside class="kpi-sidebar">
                    <div class="dashboard-stats" id="dashboardStats" style="display: none;">
                        <div class="stat-card">
                            <div class="stat-icon active-tasks">🚀</div>
                            <div class="stat-info">
                                <h4>В роботі</h4>
                                <p id="statActive">0</p>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon done-tasks">✅</div>
                            <div class="stat-info">
                                <h4>Виконано</h4>
                                <p id="statDone">0</p>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon overdue-tasks">⚠️</div>
                            <div class="stat-info">
                                <h4>Прострочено</h4>
                                <p id="statOverdue">0</p>
                            </div>
                        </div>
                    </div>

                    <!-- Calendar Widget -->
                    <div class="calendar-widget" id="calendarWidget">
                        <div class="calendar-widget-header">
                            <div class="calendar-widget-title">
                                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                                    viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                    <line x1="16" y1="2" x2="16" y2="6"></line>
                                    <line x1="8" y1="2" x2="8" y2="6"></line>
                                    <line x1="3" y1="10" x2="21" y2="10"></line>
                                </svg>
                                Календар
                                <button onclick="openEventModal()"
                                    style="background: var(--primary); border: none; color: white; width: 22px; height: 22px; border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 1rem; line-height: 1; transition: all 0.2s; margin-left: 0.25rem;"
                                    title="Додати подію">
                                    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"
                                        viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M12 5v14M5 12h14"></path>
                                    </svg>
                                </button>
                            </div>
                            <div class="calendar-tabs">
                                <button class="calendar-tab active" id="tabToday"
                                    onclick="switchCalendarTab('today')">Сьогодні</button>
                                <button class="calendar-tab" id="tabWeek"
                                    onclick="switchCalendarTab('week')">Тиждень</button>
                            </div>
                        </div>
                        <div class="calendar-events-list" id="calendarEventsList">
                            <div class="calendar-loader">
                                <div class="loader" style="width: 28px; height: 28px; border-width: 2px;"></div>
                            </div>
                        </div>
                        <div class="calendar-footer">
                            <a href="https://calendar.google.com" target="_blank">
                                <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"
                                    viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"></path>
                                    <polyline points="15 3 21 3 21 9"></polyline>
                                    <line x1="10" y1="14" x2="21" y2="3"></line>
                                </svg>
                                Відкрити Google Calendar
                            </a>
                        </div>
                    </div>
                </aside>
            </div>
        </div>
