<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TASKA — Голосове введення</title>
    <style>
        :root {
            --bg: #0f1115;
            --card: #171a21;
            --border: #2a2e38;
            --text: #e8eaed;
            --text-muted: #9aa0ac;
            --primary: #6366f1;
            --primary-hover: #4f52d9;
            --danger: #f2685c;
            --success: #34d399;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
            padding: 1.5rem;
        }

        .card {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            align-items: center;
        }

        .mic-btn {
            width: 128px;
            height: 128px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s ease;
            flex-shrink: 0;
        }

        .mic-btn:hover {
            background: var(--primary-hover);
        }

        .mic-btn.listening {
            background: var(--danger);
            animation: pulse 1.4s ease-out infinite;
        }

        .mic-btn.sending {
            background: var(--success);
            animation: none;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(242, 104, 92, 0.5);
            }

            70% {
                box-shadow: 0 0 0 28px rgba(242, 104, 92, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(242, 104, 92, 0);
            }
        }

        .status {
            font-size: 1rem;
            text-align: center;
            min-height: 1.4em;
        }

        .status.error {
            color: var(--danger);
            font-size: 0.9rem;
        }

        textarea {
            width: 100%;
            min-height: 96px;
            resize: vertical;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            padding: 0.75rem;
            font-family: inherit;
            font-size: 1rem;
            line-height: 1.45;
            outline: none;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        .actions {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        button.action {
            flex: 1;
            padding: 0.85rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            font-size: 0.95rem;
            cursor: pointer;
        }

        button.action.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        button.action.primary:hover {
            background: var(--primary-hover);
        }

        button.action:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .hint {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            margin: 0;
        }
    </style>
</head>

<body>
    <div class="card">
        <button class="mic-btn" id="micBtn" title="Мікрофон">
            <svg width="52" height="52" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
        </button>

        <div class="status" id="status">Запускаю мікрофон...</div>

        <textarea id="transcript" placeholder="Розпізнаний текст з'явиться тут..."></textarea>

        <div class="actions">
            <button class="action" id="cancelBtn">Скасувати</button>
            <button class="action primary" id="sendBtn" disabled>Надіслати</button>
        </div>

        <p class="hint">Говоріть — за паузою текст надішлеться сам. Тапніть будь-де, щоб зупинити авто-відправку.</p>
    </div>

    <script>
        // Пауза в мовленні, після якої вважаємо репліку завершеною
        const SILENCE_MS = 2500;
        // Вікно, протягом якого можна скасувати авто-відправку
        const COUNTDOWN_MS = 3000;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const micBtn = document.getElementById('micBtn');
        const statusEl = document.getElementById('status');
        const transcriptEl = document.getElementById('transcript');
        const sendBtn = document.getElementById('sendBtn');
        const cancelBtn = document.getElementById('cancelBtn');

        let recognition = null;
        let isListening = false;
        let finalTranscript = '';
        let silenceTimer = null;
        let countdownTimer = null;

        function setStatus(text, isError) {
            statusEl.textContent = text;
            statusEl.className = isError ? 'status error' : 'status';
        }

        function syncSendBtn() {
            sendBtn.disabled = !transcriptEl.value.trim();
        }

        function clearTimers() {
            clearTimeout(silenceTimer);
            clearInterval(countdownTimer);
            silenceTimer = null;
            countdownTimer = null;
        }

        function stopListening() {
            isListening = false;
            micBtn.classList.remove('listening');
            if (recognition) {
                try { recognition.stop(); } catch (e) { /* not running */ }
            }
        }

        function startListening() {
            if (!recognition || isListening) return;
            clearTimers();
            isListening = true;
            micBtn.classList.remove('sending');
            micBtn.classList.add('listening');
            try {
                recognition.start();
            } catch (e) {
                // вже запущено — стан вирівняється в onstart
            }
        }

        /** Зупиняє авто-відправку, лишаючи текст для ручного правлення. */
        function abortAutoSend() {
            if (!countdownTimer && !silenceTimer) return;
            const wasCountingDown = !!countdownTimer;
            clearTimers();
            micBtn.classList.remove('sending');
            if (wasCountingDown) {
                setStatus('Авто-відправку скасовано — виправте текст і надішліть');
            }
        }

        function send() {
            const text = transcriptEl.value.trim();
            if (!text) return;
            clearTimers();
            stopListening();
            if (window.opener) {
                window.opener.postMessage({ source: 'taska-voice', text: text }, '*');
            }
            window.close();
        }

        /** Показує коротке вікно на скасування, після якого текст іде в чат сам. */
        function beginAutoSend() {
            if (!transcriptEl.value.trim()) return;
            stopListening();
            micBtn.classList.add('sending');

            let left = Math.ceil(COUNTDOWN_MS / 1000);
            setStatus('Надсилаю через ' + left + '...');
            countdownTimer = setInterval(function () {
                left -= 1;
                if (left <= 0) {
                    clearTimers();
                    send();
                } else {
                    setStatus('Надсилаю через ' + left + '...');
                }
            }, 1000);
        }

        function scheduleAutoSend() {
            clearTimeout(silenceTimer);
            silenceTimer = setTimeout(beginAutoSend, SILENCE_MS);
        }

        transcriptEl.addEventListener('input', function () {
            abortAutoSend();
            finalTranscript = transcriptEl.value;
            syncSendBtn();
        });

        // Будь-який дотик до сторінки зупиняє відлік — щоб встигнути втрутитись
        document.addEventListener('pointerdown', function (event) {
            if (event.target === sendBtn || event.target === cancelBtn) return;
            abortAutoSend();
        });

        sendBtn.addEventListener('click', send);

        cancelBtn.addEventListener('click', function () {
            clearTimers();
            stopListening();
            window.close();
        });

        micBtn.addEventListener('click', function () {
            if (isListening) {
                stopListening();
                setStatus(transcriptEl.value.trim() ? 'Зупинено. Перевірте текст.' : 'Зупинено');
            } else {
                setStatus('Слухаю...');
                startListening();
            }
        });

        if (!SpeechRecognition) {
            setStatus('Цей браузер не підтримує розпізнавання мовлення. Спробуйте Chrome або Edge.', true);
            micBtn.disabled = true;
        } else {
            recognition = new SpeechRecognition();
            recognition.lang = 'uk-UA';
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;

            recognition.onstart = function () {
                setStatus('Слухаю...');
            };

            recognition.onresult = function (event) {
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const text = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += text + ' ';
                    } else {
                        interim += text;
                    }
                }
                transcriptEl.value = (finalTranscript + interim).trim();
                syncSendBtn();
                scheduleAutoSend();
            };

            recognition.onerror = function (event) {
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    isListening = false;
                    micBtn.classList.remove('listening');
                    setStatus('Доступ до мікрофона заблоковано. Дозвольте його в налаштуваннях сайту.', true);
                } else if (event.error !== 'no-speech' && event.error !== 'aborted') {
                    setStatus('Помилка: ' + event.error, true);
                }
            };

            // Браузер сам обриває сесію на довгій тиші — поки користувач не зупинив
            // мікрофон явно, продовжуємо слухати, щоб не треба було тиснути кнопку
            recognition.onend = function () {
                if (isListening) {
                    try { recognition.start(); } catch (e) { /* перезапуск не потрібен */ }
                } else {
                    micBtn.classList.remove('listening');
                }
            };

            startListening();
        }
    </script>
</body>

</html>
