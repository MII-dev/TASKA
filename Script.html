        function closeClickUpDetails() {
            document.getElementById('clickUpDetailsModal').classList.remove('active');
            clickUpDetailsTaskId = null;
        }

        /**
         * Summarizes a ClickUp task and its whole comment thread into the AI chat panel.
         */
        function aiClickUpBrief(taskId) {
            const task = clickUpTasks.find(function (t) { return t.id === taskId; });
            const taskName = task ? task.name : 'Задача ClickUp';

            closeClickUpDetails();

            const panel = document.getElementById('aiChatPanel');
            if (!panel.classList.contains('active')) {
                panel.classList.add('active');
            }

            const messageText = `📋 Бриф по ClickUp-задачі: "${taskName}"`;
            addAiMsg(messageText, 'user');
            showAiTyping();

            google.script.run
                .withSuccessHandler(function (responseText) {
                    hideAiTyping();
                    addAiMsg(responseText, 'bot');
                    pushChatHistory(messageText, responseText);
                })
                .withFailureHandler(function (err) {
                    hideAiTyping();
                    addAiMsg('Не вдалося підготувати бриф: ' + (err.message || String(err)), 'bot');
                })
                .aiClickUpTaskBrief(taskId);
        }

        /**
         * Opens the local task modal pre-filled from a ClickUp task, with AI-generated steps.
         */
        function createLocalTaskFromClickUp(taskId) {
            const btn = document.getElementById('clickUpDetailsToLocalBtn');
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerText = 'Готую...';

            google.script.run
                .withSuccessHandler(function (details) {
                    const priorityMap = { 1: 'Високий', 2: 'Високий', 3: 'Середній', 4: 'Низький' };

                    google.script.run
                        .withSuccessHandler(function (steps) {
                            btn.disabled = false;
                            btn.innerText = originalText;
                            closeClickUpDetails();
                            fillLocalTaskFromClickUp(details, priorityMap, steps || []);
                        })
                        .withFailureHandler(function () {
                            // Steps are a bonus — still open the modal without them
                            btn.disabled = false;
                            btn.innerText = originalText;
                            closeClickUpDetails();
                            fillLocalTaskFromClickUp(details, priorityMap, []);
                        })
                        .aiDecomposeTaskText(details.name, details.description || '');
                })
                .withFailureHandler(function (err) {
                    btn.disabled = false;
                    btn.innerText = originalText;
                    alert('Не вдалося завантажити задачу: ' + (err.message || String(err)));
                })
                .getClickUpTaskDetails(taskId, null);
        }

        function fillLocalTaskFromClickUp(details, priorityMap, steps) {
            openModal(null);

            document.getElementById('title').value = details.name || '';

            let description = '';
            if (details.description) description += details.description.trim() + '\n\n';
            description += 'Джерело: ClickUp — ' + details.url;
            document.getElementById('description').value = description;

            if (details.priority && priorityMap[details.priority]) {
                document.getElementById('priority').value = priorityMap[details.priority];
            }
            if (details.dueDate) {
                document.getElementById('deadline').value = toDateInputValue(details.dueDate);
            }
            if (details.listName) {
                document.getElementById('category').value = details.listName;
            }
            document.getElementById('resultLink').value = details.url || '';

            if (steps.length > 0) {
                modalSteps = steps;
                renderModalSteps(modalSteps, null);
            }
        }

        function renderClickUpDetails(details) {
            const body = document.getElementById('clickUpDetailsBody');
            const listTask = clickUpTasks.find(function (t) { return t.id === details.id; });
            let html = '';

            // --- Meta row ---
            const priorityInfo = getClickUpPriorityInfo(details.priority);
            html += '<div class="clickup-details-section"><div class="clickup-details-meta">';
            html += '<span class="clickup-status-badge" style="background: ' + hexToRgba(details.status.color, 0.15) + '; color: ' + details.status.color + ';">' + escapeHtml(details.status.name) + '</span>';
            if (priorityInfo) {
                html += '<span class="clickup-priority-flag ' + priorityInfo.cls + '">' + priorityInfo.icon + ' ' + priorityInfo.label + '</span>';
            }
            if (details.dueDate) {
                html += '<span style="font-size: 0.78rem; ' + getClickUpDeadlineStyle(details.dueDate) + '">📅 ' + formatClickUpDate(details.dueDate) + '</span>';
            }
            const path = details.path || (listTask ? listTask.path : '');
            if (path) {
                html += '<span class="clickup-path" style="max-width: none;">📂 ' + escapeHtml(path) + '</span>';
            }
            (details.tags || []).forEach(function (tag) {
                html += '<span class="clickup-tag">' + escapeHtml(tag) + '</span>';
            });
            html += '</div></div>';

            // --- Creator ---
            if (details.creator && details.creator.name) {
                const createdSuffix = details.dateCreated
                    ? ' <span style="color: var(--text-muted); font-size: 0.75rem;">· ' + new Date(details.dateCreated).toLocaleDateString('uk-UA') + '</span>'
                    : '';
                html += '<div class="clickup-details-section">' +
                    '<div class="clickup-details-label">Хто створив</div>' +
                    '<div class="clickup-details-meta">' +
                    '<span class="clickup-assignee-chip">' +
                    '<span class="comment-avatar" style="background-color: ' + details.creator.color + ';">' + escapeHtml(details.creator.initials) + '</span>' +
                    escapeHtml(details.creator.name) + '</span>' +
                    createdSuffix +
                    '</div></div>';
            }

            // --- Assignees ---
            if (details.assignees && details.assignees.length > 0) {
                html += '<div class="clickup-details-section">' +
                    '<div class="clickup-details-label">Виконавці</div>' +
                    '<div class="clickup-details-meta">' +
                    details.assignees.map(function (a) {
                        return '<span class="clickup-assignee-chip">' +
                            '<span class="comment-avatar" style="background-color: ' + a.color + ';">' + escapeHtml(a.initials) + '</span>' +
                            escapeHtml(a.name) + '</span>';
                    }).join('') +
                    '</div></div>';
            }

            // --- Time tracking ---
            if (details.timeEstimate || details.timeSpent) {
                const spent = details.timeSpent || 0;
                const estimate = details.timeEstimate || 0;
                const over = estimate > 0 && spent > estimate;
                const percent = estimate > 0 ? Math.min(100, Math.round((spent / estimate) * 100)) : 0;

                html += '<div class="clickup-details-section">' +
                    '<div class="clickup-details-label">Час</div>' +
                    '<div style="display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 0.35rem;">' +
                    '<span>Витрачено: <strong style="color: ' + (over ? 'var(--danger)' : 'var(--status-new-text)') + ';">' + (spent ? formatClickUpDuration(spent) : '—') + '</strong></span>' +
                    '<span style="color: var(--text-muted);">Оцінка: <strong>' + (estimate ? formatClickUpDuration(estimate) : '—') + '</strong></span>' +
                    '</div>';

                if (estimate > 0) {
                    html += '<div class="clickup-time-bar"><div class="clickup-time-bar-fill' + (over ? ' over-estimate' : '') + '" style="width: ' + percent + '%;"></div></div>';
                    if (over) {
                        html += '<div style="font-size: 0.72rem; color: var(--danger); margin-top: 0.3rem;">Перевищено оцінку на ' + formatClickUpDuration(spent - estimate) + '</div>';
                    }
                }
                html += '</div>';
            }

            // --- Full description ---
            html += '<div class="clickup-details-section">' +
                '<div class="clickup-details-label">Опис</div>';
            if (details.description && details.description.trim()) {
                html += '<div class="clickup-details-desc">' + escapeHtml(details.description.trim()) + '</div>';
            } else {
                html += '<div style="font-size: 0.82rem; color: var(--text-muted); font-style: italic;">Опис не заповнено.</div>';
            }
            html += '</div>';

            // --- Checklists ---
            if (details.checklists && details.checklists.length > 0) {
                html += '<div class="clickup-details-section"><div class="clickup-details-label">Чеклісти</div>';
                details.checklists.forEach(function (cl) {
                    const done = cl.items.filter(function (i) { return i.resolved; }).length;
                    html += '<div class="clickup-checklist">' +
                        '<div class="clickup-checklist-title"><span>' + escapeHtml(cl.name) + '</span>' +
                        '<span style="color: var(--text-muted); font-weight: 500;">' + done + '/' + cl.items.length + '</span></div>' +
                        cl.items.map(function (item) {
                            return '<div class="clickup-checklist-item' + (item.resolved ? ' resolved' : '') + '">' +
                                '<span>' + (item.resolved ? '☑' : '☐') + '</span>' +
                                '<span>' + escapeHtml(item.name) + '</span></div>';
                        }).join('') +
                        '</div>';
                });
                html += '</div>';
            }

            // --- Subtasks ---
            if (details.subtasks && details.subtasks.length > 0) {
                html += '<div class="clickup-details-section">' +
                    '<div class="clickup-details-label">Підзадачі (' + details.subtasks.length + ')</div>';
                details.subtasks.forEach(function (st) {
                    html += '<div class="clickup-details-subtask">' +
                        '<span class="clickup-status-dot" style="background: ' + st.status.color + '; margin-top: 0;"></span>' +
                        '<span style="flex: 1; min-width: 0;">' + escapeHtml(st.name) + '</span>' +
                        '<span class="clickup-status-badge" style="background: ' + hexToRgba(st.status.color, 0.15) + '; color: ' + st.status.color + ';">' + escapeHtml(st.status.name) + '</span>' +
                        '</div>';
                });
                html += '</div>';
            }

            // --- Footer dates ---
            const footerBits = [];
            if (details.dateCreated) footerBits.push('Створено: ' + new Date(details.dateCreated).toLocaleString('uk-UA'));
            if (details.dateUpdated) footerBits.push('Оновлено: ' + new Date(details.dateUpdated).toLocaleString('uk-UA'));
            if (footerBits.length > 0) {
                html += '<div style="font-size: 0.72rem; color: var(--text-muted); border-top: 1px dashed var(--border); padding-top: 0.6rem;">' +
                    footerBits.join(' · ') + '</div>';
            }

            body.innerHTML = html;
        }

        function hexToRgba(hex, alpha) {
            if (!hex) return 'rgba(151, 160, 176, ' + alpha + ')';
            hex = hex.replace('#', '');
            if (hex.length === 3) {
                hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
            }
            var r = parseInt(hex.substring(0, 2), 16);
            var g = parseInt(hex.substring(2, 4), 16);
            var b = parseInt(hex.substring(4, 6), 16);
            return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // ==========================================
        // ====== ClickUp Task Comments JS ==========
        // ==========================================
        let currentClickUpTaskId = null;
        let clickUpCommentsRefreshInterval = null;

        function openClickUpComments(taskId) {
            if (!clickUpHasToken) {
                alert('ClickUp не підключено. Підключіть його спочатку у вкладці ClickUp.');
                return;
            }

            currentClickUpTaskId = taskId;
            const task = clickUpTasks.find(t => t.id === taskId);
            const taskName = task ? task.name : 'Задача';

            document.getElementById('clickUpCommentsModalTitle').innerText = '💬 Коментарі: ' + taskName;
            document.getElementById('clickUpCommentsModal').classList.add('active');
            document.getElementById('clickUpCommentsList').innerHTML = '';
            document.getElementById('clickUpCommentInput').value = '';

            loadClickUpComments();

            // Set up polling interval to refresh comments every 10 seconds while modal is open
            if (clickUpCommentsRefreshInterval) {
                clearInterval(clickUpCommentsRefreshInterval);
            }
            clickUpCommentsRefreshInterval = setInterval(loadClickUpComments, 10000);
        }

        function closeClickUpComments() {
            document.getElementById('clickUpCommentsModal').classList.remove('active');
            currentClickUpTaskId = null;
            if (clickUpCommentsRefreshInterval) {
                clearInterval(clickUpCommentsRefreshInterval);
                clickUpCommentsRefreshInterval = null;
            }
        }

        function loadClickUpComments() {
            if (!currentClickUpTaskId) return;

            const loader = document.getElementById('clickUpCommentsLoader');
            const commentsListEl = document.getElementById('clickUpCommentsList');

            // Only show loader if we don't have existing comments displayed (for smoother polling)
            if (commentsListEl.children.length === 0) {
                loader.style.display = 'block';
            }

            google.script.run
                .withSuccessHandler(function (comments) {
                    loader.style.display = 'none';
                    if (!currentClickUpTaskId) return; // Modal was closed in the meantime
                    renderClickUpComments(comments);
                })
                .withFailureHandler(function (err) {
                    loader.style.display = 'none';
                    if (commentsListEl.children.length === 0) {
                        commentsListEl.innerHTML = '<div class="empty-state" style="border: none; background: transparent; padding: 1.5rem 1rem;">' +
                            '<p style="color: var(--danger); font-size: 0.85rem;">Помилка завантаження: ' + (err.message || String(err)) + '</p>' +
                            '</div>';
                    }
                })
                .getClickUpTaskComments(currentClickUpTaskId, null);
        }

        function renderClickUpComments(comments) {
            const commentsListEl = document.getElementById('clickUpCommentsList');

            if (!comments || comments.length === 0) {
                commentsListEl.innerHTML = '<div class="empty-state" style="border: none; background: transparent; padding: 2rem 1rem;">' +
                    '<h3 style="font-size: 1.1rem; color: var(--text-muted);">Коментарів немає</h3>' +
                    '<p style="font-size: 0.8rem;">Будьте першим, хто напише коментар!</p>' +
                    '</div>';
                return;
            }

            // Scroll height retention check (auto-scroll to bottom of comments if user was already at the bottom)
            const shouldScrollToBottom = commentsListEl.scrollHeight - commentsListEl.scrollTop - commentsListEl.clientHeight < 40 || commentsListEl.scrollTop === 0;

            var html = '';
            comments.forEach(function (comment) {
                const dateStr = comment.date ? new Date(comment.date).toLocaleString('uk-UA') : '';

                html += '<div class="comment-item">' +
                    '<div class="comment-avatar" style="background-color: ' + comment.userColor + ';" title="' + escapeHtml(comment.userName) + '">' +
                    escapeHtml(comment.userInitials) +
                    '</div>' +
                    '<div class="comment-body">' +
                    '<div class="comment-header">' +
                    '<span class="comment-author">' + escapeHtml(comment.userName) + '</span>' +
                    '<span class="comment-date">' + dateStr + '</span>' +
                    '</div>' +
                    '<div class="comment-content">' + escapeHtml(comment.text) + '</div>' +
                    '</div>' +
                    '</div>';
            });

            commentsListEl.innerHTML = html;

            if (shouldScrollToBottom) {
                commentsListEl.scrollTop = commentsListEl.scrollHeight;
            }
        }

        function sendClickUpComment() {
            const inputEl = document.getElementById('clickUpCommentInput');
            const sendBtn = document.getElementById('clickUpCommentSendBtn');
            const commentText = inputEl.value.trim();

            if (!commentText || !currentClickUpTaskId) return;

            inputEl.disabled = true;
            sendBtn.disabled = true;
            sendBtn.innerText = 'Надсилаю...';

            google.script.run
                .withSuccessHandler(function () {
                    inputEl.disabled = false;
                    sendBtn.disabled = false;
                    sendBtn.innerText = 'Надіслати';
                    inputEl.value = '';

                    // Reload comments immediately to show the new one
                    loadClickUpComments();
                })
                .withFailureHandler(function (err) {
                    inputEl.disabled = false;
                    sendBtn.disabled = false;
                    sendBtn.innerText = 'Надіслати';
                    alert('Не вдалося надіслати коментар: ' + (err.message || String(err)));
                })
                .postClickUpTaskComment(currentClickUpTaskId, null, commentText);
        }
    </script>
