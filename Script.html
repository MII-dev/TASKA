                </div>`;
                return;
            }

            grid.innerHTML = filtered.map(generateProjectCardHTML).join('');
        }

        function filterProjects() {
            renderProjectsDashboard();
        }

        function generateProjectCardHTML(project) {
            const tasks = allTasks.filter(t => t['Проєкт'] === project.ID);
            const activeCount = tasks.filter(t => t.Статус !== 'Виконано').length;

            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const overdueCount = tasks.filter(t => {
                if (t.Статус === 'Виконано' || !t.Дедлайн) return false;
                const d = new Date(t.Дедлайн);
                if (isNaN(d)) return false;
                d.setHours(0, 0, 0, 0);
                return d < today;
            }).length;

            const branches = project.Гілки || [];
            const branchesHtml = branches.map(b => {
                const bTasks = tasks.filter(t => t['Гілка'] === b.id);
                const done = bTasks.filter(t => t.Статус === 'Виконано').length;
                return `<span class="tag-category">🔀 ${b.name} ${done}/${bTasks.length}</span>`;
            }).join('');

            return `
                <div class="project-card" onclick="openProjectDetail('${project.ID}')">
                    <div class="project-card-header">
                        <div class="project-card-title">${project.Назва}</div>
                        <span class="badge ${getProjectBadgeClass(project.Статус)}">${project.Статус || ''}</span>
                    </div>
                    ${project.Опис ? `<div class="project-card-desc">${project.Опис}</div>` : ''}
                    ${branchesHtml ? `<div class="project-card-branches">${branchesHtml}</div>` : ''}
                    <div class="project-card-stats">
                        <span>Активних: <strong>${activeCount}</strong></span>
                        <span class="stat-overdue">Прострочено: <strong>${overdueCount}</strong></span>
                        <span class="${getProjectStalenessClass(project['Дата оновлення'])}">🕒 Оновлено: ${formatRelativeTime(project['Дата оновлення'])}</span>
                    </div>
                </div>
            `;
        }

        function openProjectDetail(id) {
            const project = projectsData.find(p => p.ID === id);
            if (!project) return;
            currentProjectDetailId = id;
            document.getElementById('projectsDashboardView').style.display = 'none';
            const detail = document.getElementById('projectDetailView');
            detail.style.display = 'block';
            renderProjectDetail(project);
        }

        function closeProjectDetail() {
            currentProjectDetailId = null;
            const dashboard = document.getElementById('projectsDashboardView');
            const detail = document.getElementById('projectDetailView');
            if (dashboard) dashboard.style.display = 'block';
            if (detail) {
                detail.style.display = 'none';
                detail.innerHTML = '';
            }
        }

        function renderProjectDetail(project) {
            const detail = document.getElementById('projectDetailView');
            const tasks = allTasks.filter(t => t['Проєкт'] === project.ID);
            const branches = project.Гілки || [];
            const contacts = project.Контакти || [];

            // Link/notes edits re-render this whole view; <details> forgets its
            // open state on innerHTML replacement, so capture it here and
            // re-apply it below to avoid the accordion snapping shut mid-edit.
            const openBranchIds = new Set(
                Array.from(detail.querySelectorAll('.project-branch-group[data-branch-id]'))
                    .filter(el => el.open)
                    .map(el => el.dataset.branchId)
            );

            const contactsHtml = contacts.length > 0
                ? contacts.map(c => `
                    <div class="project-contact-row">
                        <span style="font-weight: 600;">${c.name || ''}</span>
                        ${c.role ? `<span class="tag-assignee">${c.role}</span>` : ''}
                        ${c.contact ? `<span style="color: var(--text-muted);">${c.contact}</span>` : ''}
                    </div>
                `).join('')
                : '<p style="color: var(--text-muted); font-size: 0.85rem;">Контактів ще немає.</p>';

            function renderBranchLinksHtml(project, branch) {
                const links = branch.links || [];
                if (links.length === 0) return '';
                return `<div class="project-branch-links">${links.map((l, li) => `
                    <span style="display: inline-flex; align-items: center; margin: 0 0.4rem 0.4rem 0;">
                        <a class="project-link-chip" style="margin: 0;" href="${escapeHtml(l.url)}" target="_blank" rel="noopener">🔗 ${escapeHtml(l.label || l.url)}</a>
                        <button type="button" class="project-link-chip-remove" onclick="deleteBranchLink('${project.ID}', '${branch.id}', ${li})" title="Видалити">×</button>
                    </span>
                `).join('')}</div>`;
            }

            let branchesTasksHtml = branches.map(b => {
                const bTasks = tasks.filter(t => t['Гілка'] === b.id);
                const done = bTasks.filter(t => t.Статус === 'Виконано').length;
                const tasksHtml = bTasks.length > 0
                    ? bTasks.map((t, i) => generateCardHTML(t, i)).join('')
                    : '<p style="color: var(--text-muted); font-size: 0.85rem;">Немає задач у цій гілці.</p>';
                return `
                    <details class="project-branch-group" data-branch-id="${b.id}" ${openBranchIds.has(b.id) ? 'open' : ''}>
                        <summary class="project-branch-summary">
                            <span>🔀 ${escapeHtml(b.name)}
                                <span style="color: var(--text-muted); font-weight: 400;">(${done}/${bTasks.length})</span>
                            </span>
                            <button type="button" class="ai-btn-sm" onclick="event.stopPropagation(); openModalForBranch('${project.ID}', '${b.id}')">➕ Задача</button>
                        </summary>
                        <div class="project-branch-body">
                            <div class="task-list">${tasksHtml}</div>

                            <div>
                                <label class="project-branch-subsection-label">📝 Нотатки гілки</label>
                                <textarea class="branch-inline-notes" placeholder="Нотатки по цій гілці..."
                                    onchange="saveBranchNotes('${project.ID}', '${b.id}', this)">${b.notes || ''}</textarea>
                            </div>

                            <div>
                                <label class="project-branch-subsection-label">🔗 Посилання гілки</label>
                                ${renderBranchLinksHtml(project, b)}
                                <div class="list-editor-row">
                                    <input type="text" id="branchLinkLabel_${b.id}" placeholder="Назва (документ, репо...)"
                                        onkeydown="if(event.key==='Enter')addBranchLink('${project.ID}', '${b.id}')">
                                    <input type="url" id="branchLinkUrl_${b.id}" placeholder="https://..."
                                        onkeydown="if(event.key==='Enter')addBranchLink('${project.ID}', '${b.id}')">
                                    <button type="button" class="ai-btn-sm" onclick="addBranchLink('${project.ID}', '${b.id}')">➕</button>
                                </div>
                            </div>
                        </div>
                    </details>
                `;
            }).join('');

            const branchIds = branches.map(b => b.id);
            const unassignedTasks = tasks.filter(t => !branchIds.includes(t['Гілка']));
            if (unassignedTasks.length > 0 || branches.length === 0) {
                const tasksHtml = unassignedTasks.length > 0
                    ? unassignedTasks.map((t, i) => generateCardHTML(t, i)).join('')
                    : '<p style="color: var(--text-muted); font-size: 0.85rem;">Немає задач.</p>';
                branchesTasksHtml += `
                    <details class="project-branch-group" data-branch-id="__unassigned" ${openBranchIds.has('__unassigned') ? 'open' : ''}>
                        <summary class="project-branch-summary">
                            <span>📋 Без гілки</span>
                            <button type="button" class="ai-btn-sm" onclick="event.stopPropagation(); openModalForBranch('${project.ID}', '')">➕ Задача</button>
                        </summary>
                        <div class="project-branch-body">
                            <div class="task-list">${tasksHtml}</div>
                        </div>
                    </details>
                `;
            }

            detail.innerHTML = `
                <button class="project-detail-back" onclick="closeProjectDetail()">← Назад до проєктів</button>
                <div class="project-detail-header">
                    <div>
                        <h2 style="font-family: 'Outfit', sans-serif; font-size: var(--text-2xl); color: var(--text-main); margin-bottom: 0.4rem;">${project.Назва}</h2>
                        <span class="badge ${getProjectBadgeClass(project.Статус)}">${project.Статус || ''}</span>
                        <span class="project-staleness-label ${getProjectStalenessClass(project['Дата оновлення'])}">🕒 Востаннє оновлено: ${formatDate(project['Дата оновлення'])}</span>
                    </div>
                    <div style="display: flex; gap: 0.5rem;">
                        <button class="btn btn-outline" onclick="openProjectModal('${project.ID}')">✏️ Редагувати</button>
                    </div>
                </div>

                <div class="project-detail-section">
                    <h3>🔀 Гілки та задачі</h3>
                    ${branchesTasksHtml}
                </div>

                ${project.Опис ? `<div class="project-detail-section"><h3>📝 Нотатки</h3><p style="color: var(--text-main); white-space: pre-wrap;">${project.Опис}</p></div>` : ''}

                <div class="project-detail-section">
                    <h3>👤 Контакти / стейкхолдери</h3>
                    ${contactsHtml}
                </div>

                ${renderSpecsSection(project)}
            `;
        }

        // ---- ТВ/ТЗ (specs) ----

        let specsData = [];

        function loadSpecs() {
            google.script.run
                .withSuccessHandler(data => { specsData = data || []; })
                .withFailureHandler(err => console.error('Failed to load specs:', err))
                .getSpecs();
        }

        function getSpecBadgeClass(status) {
            switch (status) {
                case 'Чернетка': return 'badge-new';
                case 'Активне': return 'badge-progress';
                case 'Затверджено': return 'badge-done';
                case 'Архів': return 'badge-archived';
                default: return '';
            }
        }

        function renderSpecsSection(project) {
            const specs = specsData.filter(s => s['Проєкт'] === project.ID);
            const tvList = specs.filter(s => s['Тип'] === 'ТВ');
            const tzList = specs.filter(s => s['Тип'] === 'ТЗ');

            function renderRow(spec) {
                const originChip = spec['Тип'] === 'ТЗ' && spec['ПоходитьВід']
                    ? (() => {
                        const source = specsData.find(s => s.ID === spec['ПоходитьВід']);
                        return source
                            ? `<span class="tag-assignee" style="cursor: pointer;" onclick="event.stopPropagation(); openSpecModal('${source.ID}', '${project.ID}', 'ТВ')">сформовано з «${escapeHtml(source.Назва)}»</span>`
                            : '';
                    })()
                    : '';
                return `
                    <div class="project-contact-row" style="cursor: pointer;" onclick="openSpecModal('${spec.ID}', '${project.ID}', '${spec['Тип']}')">
                        <span style="font-weight: 600;">${escapeHtml(spec.Назва)}</span>
                        <span class="badge ${getSpecBadgeClass(spec['Статус'])}">${spec['Статус'] || ''}</span>
                        ${originChip}
                        <button type="button" class="ai-btn-sm" id="specGenBtn_${spec.ID}"
                            onclick="event.stopPropagation(); generateTasksFromSpec('${spec.ID}')"
                            style="margin-left: auto;" title="Згенерувати задачі з цього документа">🧩 Задачі</button>
                        <span style="color: var(--text-muted); font-size: 0.78rem;">🕒 ${formatDate(spec['Дата оновлення'])}</span>
                    </div>
                `;
            }

            const tvHtml = tvList.length > 0
                ? tvList.map(renderRow).join('')
                : '<p style="color: var(--text-muted); font-size: 0.85rem;">Технічних вимог ще немає.</p>';
            const tzHtml = tzList.length > 0
                ? tzList.map(renderRow).join('')
                : '<p style="color: var(--text-muted); font-size: 0.85rem;">Технічних завдань ще немає.</p>';

            return `
                <div class="project-detail-section">
                    <h3 style="display: flex; justify-content: space-between; align-items: center;">
                        <span>📄 ТВ та ТЗ</span>
                        <span style="display: flex; gap: 0.5rem;">
                            <button type="button" class="ai-btn-sm" onclick="openSpecModal(null, '${project.ID}', 'ТВ')">➕ Нове ТВ</button>
                            <button type="button" class="ai-btn-sm" onclick="openSpecModal(null, '${project.ID}', 'ТЗ')">➕ Нове ТЗ</button>
                            <button type="button" class="ai-btn-sm" onclick="openSpecImportModal('${project.ID}')">📎 Імпорт файлу</button>
                        </span>
                    </h3>
                    <label class="project-branch-subsection-label">Технічні вимоги (ТВ)</label>
                    ${tvHtml}
                    <label class="project-branch-subsection-label" style="margin-top: 1rem; display: block;">Технічні завдання (ТЗ)</label>
                    ${tzHtml}
                </div>
            `;
        }

        function openSpecModal(id, projectId, type) {
            const modal = document.getElementById('specModal');
            const form = document.getElementById('specForm');
            form.reset();
            document.getElementById('specId').value = '';
            document.getElementById('specProjectId').value = projectId;
            document.getElementById('specDerivedFrom').value = '';
            updateSpecContentCharCount();

            document.getElementById('specGoalInput').value = '';
            document.getElementById('specReviseInstruction').value = '';

            if (id) {
                const spec = specsData.find(s => s.ID === id);
                if (!spec) return;
                document.getElementById('specModalTitleText').innerText = 'Редагувати документ';
                document.getElementById('specDeleteBtn').hidden = false;
                document.getElementById('specId').value = spec.ID;
                document.getElementById('specType').value = spec['Тип'];
                document.getElementById('specDerivedFrom').value = spec['ПоходитьВід'] || '';
                document.getElementById('specTitle').value = spec.Назва || '';
                document.getElementById('specStatus').value = spec['Статус'] || 'Чернетка';
                document.getElementById('specContent').value = spec['Зміст'] || '';
                document.getElementById('specModalTypeBadge').innerText = spec['Тип'];
                document.getElementById('specDraftBox').style.display = 'none';
                document.getElementById('specFormalizeRow').style.display = spec['Тип'] === 'ТВ' ? 'block' : 'none';
            } else {
                document.getElementById('specModalTitleText').innerText = type === 'ТВ' ? 'Нове ТВ' : 'Нове ТЗ';
                document.getElementById('specDeleteBtn').hidden = true;
                document.getElementById('specType').value = type;
                document.getElementById('specStatus').value = 'Чернетка';
                document.getElementById('specModalTypeBadge').innerText = type;
                document.getElementById('specDraftBox').style.display = type === 'ТВ' ? 'flex' : 'none';
                document.getElementById('specFormalizeRow').style.display = 'none';
            }

            updateSpecContentCharCount();
            modal.classList.add('active');
        }

        function closeSpecModal() {
            document.getElementById('specModal').classList.remove('active');
        }

        function handleSpecOutsideClick(event) {
            if (event.target === document.getElementById('specModal')) {
                closeSpecModal();
            }
        }

        function updateSpecContentCharCount() {
            const len = document.getElementById('specContent').value.length;
            const el = document.getElementById('specContentCharCount');
            el.innerText = len > 35000 ? `${len.toLocaleString('uk-UA')} символів (наближаємось до ліміту)` : '';
        }

        function aiDraftRequirementsFromModal() {
            const title = document.getElementById('specTitle').value.trim();
            const goal = document.getElementById('specGoalInput').value.trim();
            if (!goal) {
                alert('Опишіть мету чи ідею — інакше ШІ немає з чого починати.');
                return;
            }

            const btn = document.getElementById('specDraftBtn');
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerText = 'Генерація...';

            google.script.run
                .withSuccessHandler(content => {
                    btn.disabled = false;
                    btn.innerText = originalText;
                    document.getElementById('specContent').value = content;
                    updateSpecContentCharCount();
                    if (!document.getElementById('specTitle').value.trim() && goal) {
                        document.getElementById('specTitle').value = goal.slice(0, 80);
                    }
                })
                .withFailureHandler(err => {
                    alert('Помилка створення чернетки: ' + (err.message || err));
                    btn.disabled = false;
                    btn.innerText = originalText;
                })
                .aiDraftRequirements({
                    title: title,
                    goal: goal,
                    projectId: document.getElementById('specProjectId').value
                });
        }

        function aiFormalizeSpecFromModal() {
            const sourceId = document.getElementById('specId').value;
            const projectId = document.getElementById('specProjectId').value;
            const source = specsData.find(s => s.ID === sourceId);
            if (!source) return;

            const btn = document.getElementById('specFormalizeBtn');
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerText = 'Формування ТЗ...';

            google.script.run
                .withSuccessHandler(content => {
                    btn.disabled = false;
                    btn.innerText = originalText;
                    closeSpecModal();
                    openSpecModal(null, projectId, 'ТЗ');
                    document.getElementById('specDerivedFrom').value = sourceId;
                    document.getElementById('specTitle').value = 'ТЗ: ' + (source.Назва || '');
                    document.getElementById('specContent').value = content;
                    updateSpecContentCharCount();
                })
                .withFailureHandler(err => {
                    alert('Помилка формування ТЗ: ' + (err.message || err));
                    btn.disabled = false;
                    btn.innerText = originalText;
                })
                .aiFormalizeSpec(source['Зміст'] || '', projectId);
        }

        function aiReviseSpecFromModal() {
            const instruction = document.getElementById('specReviseInstruction').value.trim();
            const content = document.getElementById('specContent').value;
            if (!instruction) {
                alert('Опишіть, що потрібно змінити.');
                return;
            }
            if (!content.trim()) {
                alert('Спершу додайте зміст документа — переписувати поки що нічого.');
                return;
            }

            const btn = document.getElementById('specReviseBtn');
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerText = 'Переписування...';

            google.script.run
                .withSuccessHandler(revised => {
                    btn.disabled = false;
                    btn.innerText = originalText;
                    document.getElementById('specContent').value = revised;
                    document.getElementById('specReviseInstruction').value = '';
                    updateSpecContentCharCount();
                })
                .withFailureHandler(err => {
                    alert('Помилка редагування: ' + (err.message || err));
                    btn.disabled = false;
                    btn.innerText = originalText;
                })
                .aiReviseSpec(content, instruction);
        }

        // ---- ТВ/ТЗ import from PDF/Word ----

        let selectedSpecFile = null;
        let specImportProjectId = null;

        function openSpecImportModal(projectId) {
            specImportProjectId = projectId;
            document.getElementById('specImportType').value = 'ТЗ';
            clearSelectedSpecFile();
            document.getElementById('specImportModal').classList.add('active');
        }

        function closeSpecImportModal() {
            document.getElementById('specImportModal').classList.remove('active');
        }

        function handleSpecDragOver(e) {
            e.preventDefault();
            e.stopPropagation();
            document.getElementById('specDropZone').classList.add('dropzone-dragover');
        }

        function handleSpecDragLeave(e) {
            e.preventDefault();
            e.stopPropagation();
            document.getElementById('specDropZone').classList.remove('dropzone-dragover');
        }

        function handleSpecDrop(e) {
            e.preventDefault();
            e.stopPropagation();
            document.getElementById('specDropZone').classList.remove('dropzone-dragover');

            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleSelectedSpecFile(files[0]);
            }
        }

        function handleSpecFileSelect(e) {
            const files = e.target.files;
            if (files.length > 0) {
                handleSelectedSpecFile(files[0]);
            }
        }

        function handleSelectedSpecFile(file) {
            const errorDiv = document.getElementById('specFileUploadError');
            errorDiv.style.display = 'none';

            const ext = file.name.split('.').pop().toLowerCase();
            const allowed = ['pdf', 'doc', 'docx'];
            if (!allowed.includes(ext)) {
                errorDiv.innerText = 'Непідтримуваний формат файлу. Будь ласка, завантажте PDF або Word документ (.doc, .docx).';
                errorDiv.style.display = 'block';
                clearSelectedSpecFile();
                return;
            }

            if (file.size > 15 * 1024 * 1024) {
                errorDiv.innerText = 'Файл занадто великий. Максимальний розмір — 15 MB.';
                errorDiv.style.display = 'block';
                clearSelectedSpecFile();
                return;
            }

            selectedSpecFile = file;

            document.getElementById('specSelectedFileName').innerText = file.name;
            document.getElementById('specSelectedFileSize').innerText = formatBytes(file.size);
            document.getElementById('specSelectedFileSection').style.display = 'flex';
            document.getElementById('btnProcessSpecFile').disabled = false;
        }

        function clearSelectedSpecFile() {
            selectedSpecFile = null;
            document.getElementById('specFileInput').value = '';
            document.getElementById('specSelectedFileSection').style.display = 'none';
            document.getElementById('btnProcessSpecFile').disabled = true;
            document.getElementById('specFileUploadError').style.display = 'none';
            document.getElementById('specFileUploadLoader').style.display = 'none';
            document.getElementById('btnProcessSpecFile').style.display = '';
            document.getElementById('btnCancelSpecUpload').style.display = '';
        }

        function processSpecFileWithAI() {
            if (!selectedSpecFile) return;

            const loader = document.getElementById('specFileUploadLoader');
            const loaderText = document.getElementById('specFileUploadLoaderText');
            const errorDiv = document.getElementById('specFileUploadError');
            const btnProcess = document.getElementById('btnProcessSpecFile');
            const btnCancel = document.getElementById('btnCancelSpecUpload');
            const chosenType = document.getElementById('specImportType').value;

            errorDiv.style.display = 'none';
            loader.style.display = 'flex';
            loaderText.innerText = 'Зчитування та кодування файлу...';
            btnProcess.disabled = true;
            btnCancel.disabled = true;

            const reader = new FileReader();
            reader.onload = function (e) {
                loaderText.innerText = 'Обробка документу ШІ (це може зайняти до 15-30 сек)...';

                const dataUrl = e.target.result;
                const base64Data = dataUrl.split(',')[1];
                const fileName = selectedSpecFile.name;
                const mimeType = selectedSpecFile.type || getMimeByExt(fileName);

                google.script.run
                    .withSuccessHandler(function (content) {
                        loader.style.display = 'none';
                        btnProcess.disabled = false;
                        btnCancel.disabled = false;

                        closeSpecImportModal();
                        openSpecModal(null, specImportProjectId, chosenType);
                        document.getElementById('specTitle').value = fileName.replace(/\.[^.]+$/, '');
                        document.getElementById('specContent').value = content;
                        updateSpecContentCharCount();
                    })
                    .withFailureHandler(function (err) {
                        loader.style.display = 'none';
                        btnProcess.disabled = false;
                        btnCancel.disabled = false;
                        errorDiv.innerText = 'Помилка обробки файлу: ' + (err.message || err);
                        errorDiv.style.display = 'block';
                    })
                    .aiImportSpecFromDocument(base64Data, fileName, mimeType);
            };

            reader.onerror = function () {
                loader.style.display = 'none';
                btnProcess.disabled = false;
                btnCancel.disabled = false;
                errorDiv.innerText = 'Помилка читання файлу на клієнті.';
                errorDiv.style.display = 'block';
            };

            reader.readAsDataURL(selectedSpecFile);
        }

        // ---- Generate tasks from a spec + review/bulk-create ----

        let specReviewItems = [];
        let specReviewProjectId = null;

        function generateTasksFromSpec(specId) {
            const spec = specsData.find(s => s.ID === specId);
            if (!spec) return;
            if (!spec['Зміст'] || !spec['Зміст'].trim()) {
                alert('Документ порожній — спершу додайте зміст.');
                return;
            }

            const btn = document.getElementById('specGenBtn_' + specId);
            const originalHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<div class="loader" style="width: 12px; height: 12px; border-width: 2px;"></div> Аналіз...';

            google.script.run
                .withSuccessHandler(items => {
                    btn.disabled = false;
                    btn.innerHTML = originalHtml;
                    if (!items || items.length === 0) {
                        alert('ШІ не запропонував жодної задачі з цього документа.');
                        return;
                    }
                    openSpecTaskReviewModal(spec, items);
                })

        function submitSpecTaskReview() {
            const selected = specReviewItems.filter(i => i.selected);
            if (selected.length === 0) {
                alert('Оберіть хоча б одну задачу.');
                return;
            }

            const btn = document.getElementById('specReviewSubmitBtn');
            btn.disabled = true;
            let created = 0;
            let failed = 0;

            function next() {
                if (created + failed >= selected.length) {
                    btn.disabled = false;
                    if (failed > 0) {
                        alert(`Створено ${created} з ${selected.length} задач. ${failed} не вдалося створити — перевірте консоль.`);
                    }
                    closeSpecTaskReviewModal();
                    loadTasks();
                    const project = projectsData.find(p => p.ID === specReviewProjectId);
                    if (project) renderProjectDetail(project);
                    return;
                }

                const item = selected[created + failed];
                btn.innerText = `Створення... (${created + failed + 1}/${selected.length})`;

                google.script.run
                    .withSuccessHandler(() => { created++; next(); })
                    .withFailureHandler(err => {
                        console.error('Не вдалося створити задачу "' + item['Назва'] + '": ', err);
                        failed++;
                        next();
                    })
                    .saveTask({
                        'Назва': item['Назва'],
                        'Опис': item['Опис'],
                        'Тип': item['Тип'],
                        'Пріоритет': item['Пріоритет'],
                        'Статус': 'Нова',
                        'Проєкт': specReviewProjectId,
                        'Гілка': item.branchChoice || ''
                    });
            }
            next();
        }

        /**

         */
        function saveBranchNotes(projectId, branchId, textarea) {
            const project = projectsData.find(p => p.ID === projectId);
            const branch = project && (project.Гілки || []).find(b => b.id === branchId);
            if (!branch) return;

            const newNotes = textarea.value.trim();
            if ((branch.notes || '') === newNotes) return;
            branch.notes = newNotes;

            const originalBorder = textarea.style.borderColor;
            textarea.style.borderColor = 'var(--status-done-text)';

            google.script.run
                .withSuccessHandler(() => {
                    setTimeout(() => textarea.style.borderColor = originalBorder, 1500);

                .saveProject(project);

        function addBranchLink(projectId, branchId) {
            const project = projectsData.find(p => p.ID === projectId);
            const branch = project && (project.Гілки || []).find(b => b.id === branchId);
            if (!branch) return;

            const labelInput = document.getElementById('branchLinkLabel_' + branchId);
            const urlInput = document.getElementById('branchLinkUrl_' + branchId);
            let url = urlInput.value.trim();
            if (!url) return;
            // Bare domains/paths (e.g. "docs.google.com/...") are otherwise stored
            // as-is and resolve as a *relative* link against the app's own URL —
            // that's the "clicking it goes somewhere weird" bug.
            if (!/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(url)) {
                url = 'https://' + url;
            }

            if (!branch.links) branch.links = [];
            branch.links.push({ label: labelInput.value.trim(), url });

            google.script.run
                .withSuccessHandler(() => renderProjectDetail(project))
                .withFailureHandler(err => alert('Помилка збереження посилання: ' + err))
                .saveProject(project);
        }

            const project = projectsData.find(p => p.ID === projectId);
            const branch = project && (project.Гілки || []).find(b => b.id === branchId);
            if (!branch || !branch.links) return;
            branch.links.splice(linkIndex, 1);

                .saveProject(project);
        }

        function loadContacts() {
            const grid = document.getElementById('contactsGrid');
            grid.innerHTML = '<div class="empty-state" style="grid-column: 1 / -1; border: none; background: transparent;"><div class="loader"></div><h3 style="margin-top: 1.5rem;">Завантаження...</h3></div>';

                })
                .getContacts();

        function renderContacts() {
            const grid = document.getElementById('contactsGrid');
            if (!grid) return;

            const query = (document.getElementById('contactSearchInput').value || '').toLowerCase();
            const categoryFilter = document.getElementById('contactCategoryFilter').value;

            const filtered = contactsData.filter(c => {
                const haystack = [c["Ім'я"], c.Посада, c.Компанія, c.Телефон, c.Email, c.Telegram].filter(Boolean).join(' ').toLowerCase();
                const matchesSearch = haystack.includes(query);
                const matchesCategory = categoryFilter === 'all' || c.Категорія === categoryFilter;
                return matchesSearch && matchesCategory;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty-state" style="grid-column: 1 / -1; border: none; background: transparent;">
                    <h3>Контактів поки немає</h3>
                    <p style="margin-top: 0.5rem; color: var(--text-muted);">Натисніть «Новий контакт», щоб почати.</p>
                </div>`;
                return;
            }

            filtered.sort((a, b) => {
                const favA = a.Обраний ? 1 : 0;
                const favB = b.Обраний ? 1 : 0;
                if (favA !== favB) return favB - favA;
                return (a["Ім'я"] || '').localeCompare(b["Ім'я"] || '');
            });

            grid.innerHTML = filtered.map(generateContactCardHTML).join('');
        }

        function filterContacts() {
            renderContacts();

        function generateContactCardHTML(contact) {
            const name = contact["Ім'я"] || '(Без імені)';
            const posLine = [contact.Посада, contact.Компанія].filter(Boolean).join(' · ');
            const catClass = CONTACT_CATEGORY_CLASS[contact.Категорія] || 'tag-category';
            const isFav = !!contact.Обраний;

            const actions = [];
            const phone = contact.Телефон;
            const email = contact.Email;

            if (phone) {
                let html = '<a class="contact-quick-btn" href="tel:' + phone + '"';
                html += ' onclick="event.stopPropagation()" title="Зателефонувати">';
                html += '📞 ' + phone + '</a>';
                actions.push(html);
            }

            if (email) {
                let html = '<a class="contact-quick-btn" href="mailto:' + email + '"';
                html += ' onclick="event.stopPropagation()" title="Написати листа">';
                html += '✉️ ' + email + '</a>';
                actions.push(html);
            }

            if (contact.Telegram) {
                const handle = contact.Telegram.replace(/^@/, '');
                const telegramUrl = 'https:' + '//t.me/' + handle;
                let html = '<a class="contact-quick-btn" href="' + telegramUrl + '" target="_blank"';
                html += ' onclick="event.stopPropagation()" title="Написати в Telegram">';
                html += '📨 Telegram</a>';
                actions.push(html);
            }

            if (phone) {
                let html = '<button type="button" class="contact-quick-btn"';
                html += ' onclick="copyContactValue(\'' + phone + '\', event)" title="Скопіювати номер">';
                html += '📋 Копіювати</button>';
                actions.push(html);
            }

            const favClass = isFav ? 'is-favorite' : '';
            const favIcon = isFav ? '★' : '☆';
            const favTitle = isFav ? 'Прибрати з обраних' : 'Додати в обрані';
            let favBtn = '<button type="button" class="icon-btn contact-favorite-btn ' + favClass + '"';
            favBtn += ' onclick="toggleContactFavorite(\'' + contact.ID + '\', event)" title="' + favTitle + '">';
            favBtn += favIcon + '</button>';

            return `
                <div class="contact-card" onclick="openContactModal('${contact.ID}')">
                    <div class="contact-card-header">
                        <div class="contact-name">${name}</div>
                        ${favBtn}
                    </div>
                    ${posLine ? `<div class="contact-pos">${posLine}</div>` : ''}
                    ${contact.Категорія ? `<span class="tag-category ${catClass}">${contact.Категорія}</span>` : ''}
                    ${actions.length ? `<div class="contact-quick-actions">${actions.join('')}</div>` : ''}
                    ${contact.Нотатки ? `<div class="contact-notes-preview">${contact.Нотатки}</div>` : ''}
                </div>
            `;
        }

        function copyContactValue(value, event) {
            if (event) event.stopPropagation();
            if (navigator.clipboard) {
                navigator.clipboard.writeText(value).catch(() => {});
            }
        }

        function toggleContactFavorite(id, event) {
            if (event) event.stopPropagation();

        // ==========================================
        // ====== ClickUp Integration JS ============
        // ==========================================
        let clickUpTasks = [];
        let clickUpStatusesByList = {};
        let clickUpCurrentUserId = null;
        let clickUpLoaded = false;
        // The token itself lives server-side now; the client only tracks whether one exists
        let clickUpHasToken = false;
        let clickUpMigrationDone = false;
        let clickUpIncludeClosed = localStorage.getItem('clickup_include_closed') === '1';
        let clickUpGroupByDate = localStorage.getItem('clickup_group_by_date') !== '0';

        const CLICKUP_DATE_GROUPS = [
            { key: 'overdue', label: '🔥 Прострочено', cls: 'group-overdue' },
            { key: 'today', label: '📌 Сьогодні', cls: 'group-today' },
            { key: 'tomorrow', label: '➡️ Завтра', cls: '' },
            { key: 'week', label: '🗓️ Цього тижня', cls: '' },
            { key: 'later', label: '🌙 Пізніше', cls: '' },
            { key: 'none', label: '∅ Без дедлайну', cls: '' }
        ];

        /**
         * Shows either the setup banner or the task view.
         */
        function setClickUpConnectedUI(connected) {
            document.getElementById('clickUpSetupBanner').style.display = connected ? 'none' : 'flex';
            document.getElementById('clickUpHeaderBar').style.display = connected ? 'flex' : 'none';
            document.getElementById('clickUpControls').style.display = connected ? 'flex' : 'none';
            if (!connected) {
                document.getElementById('clickUpTaskList').innerHTML = '';
                document.getElementById('clickUpStats').innerHTML = '';
                document.getElementById('clickUpTruncatedNotice').style.display = 'none';
            }
        }

        /**
         * One-time move of the token from localStorage to server-side storage.
         * AI features run on the server and cannot reach localStorage, so this
         * runs at startup rather than waiting for the ClickUp tab to be opened.
         * @param {Function} done - called with the resulting hasToken value
         */
        function migrateClickUpTokenIfNeeded(done) {
            const legacyToken = localStorage.getItem('clickup_token');
            if (!legacyToken || clickUpMigrationDone) {
                if (done) done(null);
                return;
            }

            clickUpMigrationDone = true;

            google.script.run
                .withSuccessHandler(function () {
                    localStorage.removeItem('clickup_token');
                    clickUpHasToken = true;
                    if (done) done(true);
                })
                .withFailureHandler(function (err) {
                    // Token turned out to be invalid — drop it and ask for a new one
                    localStorage.removeItem('clickup_token');
                    clickUpHasToken = false;
                    console.error('Міграція токена ClickUp не вдалася:', err);
                    if (done) done(false);
                })
                .setClickUpToken(legacyToken);
        }

        function initClickUpView() {
            document.getElementById('clickUpClosedToggle').checked = clickUpIncludeClosed;
            document.getElementById('clickUpGroupToggle').checked = clickUpGroupByDate;

            migrateClickUpTokenIfNeeded(function (migrated) {
                if (migrated !== null) {
                    // Migration just ran and settled the connection state
                    setClickUpConnectedUI(migrated);
                    if (migrated) loadClickUpTasks();
                    return;
                }

                google.script.run
                    .withSuccessHandler(function (status) {
                        clickUpHasToken = !!(status && status.hasToken);
                        setClickUpConnectedUI(clickUpHasToken);
                        if (clickUpHasToken && !clickUpLoaded) {
                            loadClickUpTasks();
                        }
                    })
                    .withFailureHandler(function (err) {
                        clickUpHasToken = false;
                        setClickUpConnectedUI(false);
                        console.error('Не вдалося перевірити стан ClickUp:', err);
                    })
                    .getClickUpStatus();
            });
        }

        function saveClickUpToken() {
            const input = document.getElementById('clickUpTokenInput');
            const token = input.value.trim();
            if (!token) {
                alert('Будь ласка, введіть ClickUp API Token.');
                return;
            }

            const btn = document.querySelector('#clickUpSetupBanner button');
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerText = 'Перевірка...';

            google.script.run
                .withSuccessHandler(function () {
                    btn.disabled = false;
                    btn.innerText = originalText;
                    input.value = '';
                    clickUpHasToken = true;
                    setClickUpConnectedUI(true);
                    loadClickUpTasks();
                })
                .withFailureHandler(function (err) {
                    btn.disabled = false;
                    btn.innerText = originalText;
                    alert('Не вдалося підключити ClickUp: ' + (err.message || String(err)));
                })
                .setClickUpToken(token);
        }

        function clearClickUpToken() {
            if (!confirm("Від'єднати ClickUp? Токен буде видалено.")) return;

            localStorage.removeItem('clickup_token');
            clickUpTasks = [];
            clickUpStatusesByList = {};
            clickUpLoaded = false;
            clickUpHasToken = false;
            setClickUpConnectedUI(false);

            google.script.run
                .withFailureHandler(function (err) {
                    console.error('Не вдалося видалити токен на сервері:', err);
                })
                .clearClickUpTokenServer();
        }

        function toggleClickUpClosed() {
            clickUpIncludeClosed = document.getElementById('clickUpClosedToggle').checked;
            localStorage.setItem('clickup_include_closed', clickUpIncludeClosed ? '1' : '0');
            // include_closed is a server-side filter, so this needs a refetch
            loadClickUpTasks();
        }

        function toggleClickUpGrouping() {
            clickUpGroupByDate = document.getElementById('clickUpGroupToggle').checked;
            localStorage.setItem('clickup_group_by_date', clickUpGroupByDate ? '1' : '0');
            filterClickUpTasks();
        }

        function loadClickUpTasks() {
            if (!clickUpHasToken) {
                initClickUpView();
                return;
            }

            const loader = document.getElementById('clickUpLoader');
            const taskListEl = document.getElementById('clickUpTaskList');

            loader.style.display = 'block';
            taskListEl.innerHTML = '';
            document.getElementById('clickUpTruncatedNotice').style.display = 'none';

            google.script.run
                .withSuccessHandler(function (result) {
                    loader.style.display = 'none';
                    clickUpTasks = (result && result.tasks) || [];
                    clickUpStatusesByList = (result && result.statusesByList) || {};
                    clickUpCurrentUserId = (result && result.currentUser) ? result.currentUser.id : null;
                    clickUpLoaded = true;

                    if (result && result.truncated) {
                        const notice = document.getElementById('clickUpTruncatedNotice');
                        notice.innerText = '⚠️ Показано не всі задачі — досягнуто ліміт вивантаження. Звузьте пошук або зменште кількість активних задач у ClickUp.';
                        notice.style.display = 'block';
                    }

                    populateClickUpStatuses(clickUpTasks);
                    filterClickUpTasks();
                })
                .withFailureHandler(function (err) {
                    loader.style.display = 'none';
                    var errMsg = err.message || String(err);
                    if (errMsg.includes('401') || errMsg.includes('Невалідний')) {
                        taskListEl.innerHTML = '<div class="empty-state" style="border: none; background: transparent;">' +
                            '<svg width="48" height="48" fill="none" stroke="var(--danger)" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>' +
                            '<h3 style="color: var(--danger);">Невалідний токен</h3>' +
                            '<p style="font-size: 0.85rem;">Перевірте ваш ClickUp API Token і спробуйте ще раз.</p>' +
                            '<button class="btn btn-outline" onclick="clearClickUpToken()" style="margin-top: 1rem; color: var(--text-muted);">🔓 Скинути токен</button>' +
                            '</div>';
                    } else {
                        taskListEl.innerHTML = '<div class="empty-state" style="border: none; background: transparent;">' +
                            '<h3 style="color: var(--danger);">Помилка завантаження</h3>' +
                            '<p style="font-size: 0.85rem;">' + errMsg + '</p>' +
                            '</div>';
                    }
                })
                .getClickUpTasks(null, clickUpIncludeClosed);

            loadClickUpAwaitingReply();
        }

        function loadClickUpAwaitingReply() {
            const banner = document.getElementById('clickUpAwaitingReplyBanner');
            google.script.run
                .withSuccessHandler(function (tasks) {
                    if (!tasks || tasks.length === 0) {
                        banner.style.display = 'none';
                        return;
                    }
                    document.getElementById('clickUpAwaitingReplyList').innerHTML = tasks.map(function (t) {
                        return '<div class="nudges-banner-item">• <a href="#" onclick="openClickUpDetails(\'' + t.id +
                            '\'); return false;" style="color: var(--accent-purple-light);">' + escapeHtml(t.name) +
                            '</a> — останнє слово за ' + escapeHtml(t.lastCommenter || 'кимось іншим') + '</div>';
                    }).join('');
                    banner.style.display = 'flex';
                })
                .withFailureHandler(function (err) {
                    console.error('Failed to load ClickUp awaiting-reply list:', err);

                .getClickUpAwaitingReplyTasks();

        function populateClickUpStatuses(tasks) {
            const filterEl = document.getElementById('clickUpStatusFilter');
            const currentVal = filterEl.value;

            const statuses = new Set();
            tasks.forEach(function (t) {
                if (t.status && t.status.name) {
                    statuses.add(t.status.name);
                }
            });

            var html = '<option value="all">Усі статуси</option>';
            statuses.forEach(function (status) {
                html += '<option value="' + escapeHtml(status) + '">' + escapeHtml(status) + '</option>';
            });
            filterEl.innerHTML = html;

            if (statuses.has(currentVal)) {
                filterEl.value = currentVal;
            } else {
                filterEl.value = 'all';
            }
        }

        function filterClickUpTasks() {
            const filtered = getFilteredClickUpTasks();
            renderClickUpTasks(filtered);
            updateClickUpStats(filtered);
        }

        /**
         * Applies the current search/status/sort controls and returns the matching tasks.
         */
        function getFilteredClickUpTasks() {
            const query = document.getElementById('clickUpSearchInput').value.toLowerCase();
            const status = document.getElementById('clickUpStatusFilter').value;
            const sort = document.getElementById('clickUpSortFilter').value;

            // Filter
            let filtered = clickUpTasks.filter(function (t) {
                const name = (t.name || '').toLowerCase();
                const desc = (t.description || '').toLowerCase();
                const path = (t.path || '').toLowerCase();
                const tags = (t.tags || []).join(' ').toLowerCase();
                const creator = (t.creator && t.creator.name ? t.creator.name : '').toLowerCase();
                const matchesSearch = name.includes(query) || desc.includes(query) ||
                    path.includes(query) || tags.includes(query) || creator.includes(query);

                let matchesStatus = true;
                if (status !== 'all') {
                    matchesStatus = (t.status && t.status.name === status);
                }

                return matchesSearch && matchesStatus;
            });

            // Sort
            if (sort === 'deadline') {
                filtered.sort(function (a, b) {
                    if (a.dueDate && b.dueDate) return a.dueDate - b.dueDate;
                    if (a.dueDate) return -1;
                    if (b.dueDate) return 1;
                    return 0;
                });
            } else if (sort === 'priority') {
                filtered.sort(function (a, b) {
                    var pA = a.priority === null ? 99 : a.priority;
                    var pB = b.priority === null ? 99 : b.priority;
                    return pA - pB;
                });
            } else if (sort === 'name') {
                filtered.sort(function (a, b) {
                    return (a.name || '').localeCompare(b.name || '');
                });
            } else {
                // Default
                filtered.sort(function (a, b) {
                    if (a.dueDate && b.dueDate) return a.dueDate - b.dueDate;
                    if (a.dueDate) return -1;
                    if (b.dueDate) return 1;
                    return 0;
                });
            }

            return filtered;
        }

        function updateClickUpStats(tasks) {
            var statsEl = document.getElementById('clickUpStats');
            var totalAll = clickUpTasks.length;
            var totalFiltered = tasks.length;

            var withDeadline = tasks.filter(function (t) { return t.dueDate; }).length;
            // Day-based, same rule as getClickUpDeadlineStyle — a task due today is not overdue yet
            var overdue = tasks.filter(function (t) {
                return getClickUpDateBucket(t.dueDate) === 'overdue';
            }).length;

            var totalSpent = tasks.reduce(function (sum, t) { return sum + (t.timeSpent || 0); }, 0);

            var statsHtml = '<span>📋 Показано: <strong>' + totalFiltered + '</strong> / ' + totalAll + '</span>' +
                '<span>📅 З дедлайном: <strong>' + withDeadline + '</strong></span>';

            if (overdue > 0) {
                statsHtml += '<span style="color: var(--danger);">⚠️ Прострочено: <strong>' + overdue + '</strong></span>';
            }
            if (totalSpent > 0) {
                statsHtml += '<span>⏱ Витрачено: <strong>' + formatClickUpDuration(totalSpent) + '</strong></span>';
            }
            statsEl.innerHTML = statsHtml;
        }

        /**
         * Buckets a due date into one of the date groups.
         * Day-based comparison — the time of day inside the due date is ignored.
         */
        function getClickUpDateBucket(timestamp) {
            if (!timestamp) return 'none';

            var today = new Date();
            today.setHours(0, 0, 0, 0);

            var due = new Date(timestamp);
            due.setHours(0, 0, 0, 0);

            var diffDays = Math.round((due.getTime() - today.getTime()) / 86400000);

            if (diffDays < 0) return 'overdue';
            if (diffDays === 0) return 'today';
            if (diffDays === 1) return 'tomorrow';
            if (diffDays <= 7) return 'week';
            return 'later';
        }

        /**
         * Formats a ClickUp duration (milliseconds) as "2г 30хв".
         */
        function formatClickUpDuration(ms) {
            if (!ms || ms <= 0) return '';
            var totalMinutes = Math.round(ms / 60000);
            var hours = Math.floor(totalMinutes / 60);
            var minutes = totalMinutes % 60;

            if (hours === 0) return minutes + 'хв';
            if (minutes === 0) return hours + 'г';
            return hours + 'г ' + minutes + 'хв';
        }

        /**
         * Groups tasks into parent/child relations. Subtasks whose parent is not
         * in the current result set are promoted to top level so they stay visible.
         */
        function buildClickUpTree(tasks) {
            var byId = {};
            tasks.forEach(function (t) { byId[t.id] = t; });

            var roots = [];
            var childrenOf = {};

            tasks.forEach(function (t) {
                if (t.parent && byId[t.parent]) {
                    if (!childrenOf[t.parent]) childrenOf[t.parent] = [];
                    childrenOf[t.parent].push(t);
                } else {
                    roots.push(t);
                }
            });

            return { roots: roots, childrenOf: childrenOf };
        }

        function getClickUpPriorityInfo(priority) {
            switch (priority) {
                case 1: return { label: 'Urgent', icon: '🔴', cls: 'clickup-priority-1' };
                case 2: return { label: 'High', icon: '🟠', cls: 'clickup-priority-2' };
                case 3: return { label: 'Normal', icon: '🟡', cls: 'clickup-priority-3' };
                case 4: return { label: 'Low', icon: '🔵', cls: 'clickup-priority-4' };
                default: return null;
            }
        }

        function formatClickUpDate(timestamp) {
            if (!timestamp) return '';
            var d = new Date(timestamp);
            return d.toLocaleDateString('uk-UA');
        }

        /**
         * Deadline colouring — shares getClickUpDateBucket with the grouping and the
         * stats counter, so all three always agree on what "overdue" means.
         */
        function getClickUpDeadlineStyle(timestamp) {
            switch (getClickUpDateBucket(timestamp)) {
                case 'overdue': return 'color: var(--danger); font-weight: 600;';
                case 'today': return 'color: var(--status-prog-text); font-weight: 600;';
                case 'tomorrow': return 'color: var(--status-prog-text);';
                default: return '';
            }
        }

        function renderClickUpTasks(tasks) {
            var container = document.getElementById('clickUpTaskList');

            if (!tasks || tasks.length === 0) {
                container.innerHTML = renderClickUpEmptyState();
                return;
            }

            var tree = buildClickUpTree(tasks);
            var sort = document.getElementById('clickUpSortFilter').value;
            // Grouping only makes sense while the list is ordered by date
            var useGroups = clickUpGroupByDate && (sort === 'default' || sort === 'deadline');

            var counter = { index: 0 };
            var html = '';

            if (useGroups) {
                var buckets = {};
                tree.roots.forEach(function (task) {
                    var key = getClickUpDateBucket(task.dueDate);
                    if (!buckets[key]) buckets[key] = [];
                    buckets[key].push(task);
                });

                CLICKUP_DATE_GROUPS.forEach(function (group) {
                    var groupTasks = buckets[group.key];
                    if (!groupTasks || groupTasks.length === 0) return;

                    html += '<div class="clickup-group">' +
                        '<div class="clickup-group-header ' + group.cls + '">' +
                        '<span>' + group.label + '</span>' +
                        '<span class="clickup-group-count">' + groupTasks.length + '</span>' +
                        '</div>' +
                        '<div class="clickup-task-list">' +
                        groupTasks.map(function (task) {
                            return renderClickUpTaskNode(task, tree.childrenOf, counter, 0);
                        }).join('') +
                        '</div>' +
                        '</div>';
                });
            } else {
                html = tree.roots.map(function (task) {
                    return renderClickUpTaskNode(task, tree.childrenOf, counter, 0);
                }).join('');
            }

            container.innerHTML = html;
        }

        function renderClickUpEmptyState() {
            var hasFilters = document.getElementById('clickUpSearchInput').value.trim() !== '' ||
                document.getElementById('clickUpStatusFilter').value !== 'all';

            if (hasFilters) {
                return '<div class="empty-state" style="border: none; background: transparent;">' +
                    '<svg width="48" height="48" fill="none" stroke="var(--text-muted)" stroke-width="1.5" viewBox="0 0 24 24" style="opacity: 0.6;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>' +
                    '<h3>Нічого не знайдено</h3>' +
                    '<p style="font-size: 0.85rem;">Жодна задача не підходить під пошук чи фільтр. Спробуйте змінити умови.</p>' +
                    '</div>';
            }

            return '<div class="empty-state" style="border: none; background: transparent;">' +
                '<svg width="48" height="48" fill="none" stroke="var(--primary)" stroke-width="1.5" viewBox="0 0 24 24" style="opacity: 0.6;"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>' +
                '<h3>Все виконано! 🎉</h3>' +
                '<p style="font-size: 0.85rem;">У вас немає активних задач у ClickUp.</p>' +
                '</div>';
        }

        /**
         * Renders one task card plus its subtasks, recursively.
         */
        function renderClickUpTaskNode(task, childrenOf, counter, depth) {
            var html = '<div class="clickup-task-node">' + renderClickUpTaskCard(task, counter.index++, depth);

            var children = childrenOf[task.id];
            if (children && children.length > 0) {
                html += '<div class="clickup-subtree">' +
                    children.map(function (child) {
                        return renderClickUpTaskNode(child, childrenOf, counter, depth + 1);
                    }).join('') +
                    '</div>';
            }

            return html + '</div>';
        }

        function renderClickUpTaskCard(task, index, depth) {
            var isSubtask = depth > 0;

            var statusHtml = renderClickUpStatusControl(task);
            var priorityHtml = renderClickUpPriorityControl(task);
            var deadlineHtml = renderClickUpDeadlineControl(task);
            var creatorHtml = renderClickUpCreator(task);
            var timeHtml = renderClickUpTimeBadge(task);

            var tagsHtml = '';
            if (task.tags && task.tags.length > 0) {
                tagsHtml = task.tags.map(function (tag) {
                    return '<span class="clickup-tag">' + escapeHtml(tag) + '</span>';
                }).join('');
            }

            var descHtml = '';
            if (task.description && task.description.trim()) {
                descHtml = '<div class="clickup-task-desc">' + escapeHtml(task.description) +
                    (task.hasMoreDescription ? '…' : '') + '</div>';
            }

            // Path is redundant on subtasks — they live in the same list as the parent
            var pathHtml = (task.path && !isSubtask)
                ? '<span class="clickup-path" title="' + escapeHtml(task.path) + '">📂 ' + escapeHtml(task.path) + '</span>'
                : '';

            return '<div class="clickup-task-card' + (isSubtask ? ' is-subtask' : '') + '" data-task-id="' + escapeHtml(task.id) + '" style="animation-delay: ' + (index * 0.03) + 's;">' +
                (isSubtask ? '<span class="clickup-subtask-marker" title="Підзадача">↳</span>' : '') +
                '<div class="clickup-status-dot" style="background: ' + task.status.color + ';" title="' + escapeHtml(task.status.name) + '"></div>' +
                '<div class="clickup-task-info">' +
                '<div class="clickup-task-name">' + escapeHtml(task.name) + '</div>' +
                descHtml +
                '<div class="clickup-task-meta">' +
                statusHtml +
                priorityHtml +
                deadlineHtml +
                creatorHtml +
                timeHtml +
                pathHtml +
                tagsHtml +
                '</div>' +
                '</div>' +
                '<div class="clickup-task-actions">' +
                '<button class="clickup-open-link" onclick="openClickUpDetails(\'' + task.id + '\')" title="Повний опис і деталі задачі">' +
                'ℹ️ Деталі' +
                '</button>' +
                '<button class="clickup-open-link" onclick="openClickUpComments(\'' + task.id + '\')" title="Коментарі та апдейти">' +
                '💬 Коментарі' +
                '</button>' +
                '<a href="' + escapeHtml(task.url) + '" target="_blank" class="clickup-open-link" title="Відкрити у ClickUp">' +
                '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>' +
                'Відкрити' +
                '</a>' +
                '</div>' +
                '</div>';
        }

        /**
         * Status dropdown built from the statuses of the task's own list.
         * Falls back to a read-only badge when the list statuses could not be fetched.
         */
        function renderClickUpStatusControl(task) {
            var statuses = clickUpStatusesByList[task.listId];

            if (!statuses || statuses.length === 0) {
                return '<span class="clickup-status-badge" style="background: ' + hexToRgba(task.status.color, 0.15) + '; color: ' + task.status.color + ';">' + escapeHtml(task.status.name) + '</span>';
            }

            var options = statuses.map(function (s) {
                var selected = s.name.toLowerCase() === task.status.name.toLowerCase() ? ' selected' : '';
                return '<option value="' + escapeHtml(s.name) + '"' + selected + '>' + escapeHtml(s.name.toUpperCase()) + '</option>';
            }).join('');

            return '<select class="clickup-inline-select clickup-status-select" ' +
                'style="background-color: ' + hexToRgba(task.status.color, 0.15) + '; color: ' + task.status.color + ';" ' +
                'title="Змінити статус" ' +
                'onchange="changeClickUpStatus(\'' + task.id + '\', this)">' +
                options +
                '</select>';
        }

        function renderClickUpPriorityControl(task) {
            var levels = [
                { value: '', label: '— Без пріоритету' },
                { value: '1', label: '🔴 Urgent' },
                { value: '2', label: '🟠 High' },
                { value: '3', label: '🟡 Normal' },
                { value: '4', label: '🔵 Low' }
            ];

            var current = task.priority === null || task.priority === undefined ? '' : String(task.priority);
            var info = getClickUpPriorityInfo(task.priority);

            var options = levels.map(function (level) {
                var selected = level.value === current ? ' selected' : '';
                return '<option value="' + level.value + '"' + selected + '>' + level.label + '</option>';
            }).join('');

            var colorStyle = info
                ? 'background-color: ' + hexToRgba(getClickUpPriorityColor(task.priority), 0.15) + '; color: ' + getClickUpPriorityColor(task.priority) + ';'
                : '';

            return '<select class="clickup-inline-select clickup-priority-select" style="' + colorStyle + '" ' +
                'title="Змінити пріоритет" ' +
                'onchange="changeClickUpPriority(\'' + task.id + '\', this)">' +
                options +
                '</select>';
        }

        function getClickUpPriorityColor(priority) {
            switch (priority) {
                case 1: return '#f2685c';
                case 2: return '#ffaa32';
                case 3: return '#f2b84b';
                case 4: return '#7c96ff';
                default: return '#97a0b0';
            }
        }

        function renderClickUpDeadlineControl(task) {
            var value = task.dueDate ? toDateInputValue(task.dueDate) : '';
            var style = getClickUpDeadlineStyle(task.dueDate);

            return '<input type="date" class="clickup-date-input" value="' + value + '" ' +
                'style="' + style + '" title="Змінити дедлайн" ' +
                'onchange="changeClickUpDeadline(\'' + task.id + '\', this)">';
        }

        /**
         * Shows who created the task. Tasks you created yourself are collapsed to
         * a muted "Ви", so what stands out is work that came from someone else.
         */
        function renderClickUpCreator(task) {
            if (!task.creator || !task.creator.name) return '';

            var isSelf = clickUpCurrentUserId !== null &&
                String(task.creator.id) === String(clickUpCurrentUserId);
            var label = isSelf ? 'Ви' : task.creator.name;
            var title = isSelf
                ? 'Задачу створили ви'
                : 'Задачу створив(ла): ' + task.creator.name;

            return '<span class="clickup-creator-chip' + (isSelf ? ' is-self' : '') + '" title="' + escapeHtml(title) + '">' +
                '<span class="clickup-creator-avatar" style="background-color: ' + task.creator.color + ';">' +
                escapeHtml(task.creator.initials) + '</span>' +
                '<span class="clickup-creator-name">' + escapeHtml(label) + '</span>' +
                '</span>';
        }

        function renderClickUpTimeBadge(task) {
            if (!task.timeEstimate && !task.timeSpent) return '';

            var spent = task.timeSpent || 0;
            var estimate = task.timeEstimate || 0;
            var over = estimate > 0 && spent > estimate;

            var label;
            if (estimate && spent) {
                label = formatClickUpDuration(spent) + ' / ' + formatClickUpDuration(estimate);
            } else if (estimate) {
                label = 'оцінка ' + formatClickUpDuration(estimate);
            } else {
                label = formatClickUpDuration(spent);
            }

            var title = 'Витрачено: ' + (spent ? formatClickUpDuration(spent) : '—') +
                ' · Оцінка: ' + (estimate ? formatClickUpDuration(estimate) : '—');

            return '<span class="clickup-time-badge' + (over ? ' over-estimate' : '') + '" title="' + escapeHtml(title) + '">⏱ ' + label + '</span>';
        }

        /**
         * Converts a unix ms timestamp into the YYYY-MM-DD an <input type="date"> expects,
         * using local calendar days so the shown date matches the shown deadline.
         */
        function toDateInputValue(timestamp) {
            var d = new Date(timestamp);
            var month = String(d.getMonth() + 1).padStart(2, '0');
            var day = String(d.getDate()).padStart(2, '0');
            return d.getFullYear() + '-' + month + '-' + day;
        }

        // ==========================================
        // ====== ClickUp Inline Editing JS =========
        // ==========================================

        /**
         * Sends a field update to ClickUp, applying it optimistically and
         * reverting the control if the API call fails.
         * @param {string} taskId
         * @param {Object} updates - payload for updateClickUpTask
         * @param {HTMLElement} control - the input/select that triggered the change
         * @param {string} previousValue - control value to restore on failure
         * @param {string} field - 'status' | 'priority' | 'dueDate', drives the reflow decision
         */
        function applyClickUpUpdate(taskId, updates, control, previousValue, field) {
            if (!clickUpHasToken) {
                alert('ClickUp не підключено. Підключіть його спочатку у вкладці ClickUp.');
                return;
            }

            control.disabled = true;

            google.script.run
                .withSuccessHandler(function (result) {
                    control.disabled = false;
                    control.classList.add('clickup-saved');
                    setTimeout(function () { control.classList.remove('clickup-saved'); }, 700);

                    const task = clickUpTasks.find(function (t) { return t.id === taskId; });
                    if (task) {
                        if (result.status && result.status.name) task.status = result.status;
                        task.priority = result.priority;
                        task.dueDate = result.dueDate;
                        repaintClickUpCard(task, control);
                    }

                    updateClickUpStats(getFilteredClickUpTasks());

                    // Re-render only when the change moves the card to a different group or position
                    if (needsClickUpReflow(field)) {
                        setTimeout(filterClickUpTasks, 700);
                    }
                })
                .withFailureHandler(function (err) {
                    control.disabled = false;
                    control.value = previousValue;
                    alert('Не вдалося оновити задачу: ' + (err.message || String(err)));
                })
                .updateClickUpTask(taskId, null, updates);
        }

        /**
         * True when the changed field affects where the card belongs in the current view.
         */
        function needsClickUpReflow(field) {
            const sort = document.getElementById('clickUpSortFilter').value;
            const statusFilter = document.getElementById('clickUpStatusFilter').value;

            if (field === 'status') return statusFilter !== 'all';
            if (field === 'priority') return sort === 'priority';
            if (field === 'dueDate') {
                const grouped = clickUpGroupByDate && (sort === 'default' || sort === 'deadline');
                return grouped || sort === 'default' || sort === 'deadline';
            }
            return false;
        }

        /**
         * Repaints the colour-coded bits of a single card in place, so the user
         * sees the new state without the whole list flickering.
         */
        function repaintClickUpCard(task, control) {
            const card = control.closest('.clickup-task-card');
            if (!card) return;

            const dot = card.querySelector('.clickup-status-dot');
            if (dot) {
                dot.style.background = task.status.color;
                dot.title = task.status.name;
            }

            const statusSelect = card.querySelector('.clickup-status-select');
            if (statusSelect) {
                statusSelect.style.backgroundColor = hexToRgba(task.status.color, 0.15);
                statusSelect.style.color = task.status.color;
            }

            const prioritySelect = card.querySelector('.clickup-priority-select');
            if (prioritySelect) {
                if (task.priority) {
                    const color = getClickUpPriorityColor(task.priority);
                    prioritySelect.style.backgroundColor = hexToRgba(color, 0.15);
                    prioritySelect.style.color = color;
                } else {
                    prioritySelect.style.backgroundColor = 'transparent';
                    prioritySelect.style.color = 'var(--text-muted)';
                }
            }

            const dateInput = card.querySelector('.clickup-date-input');
            if (dateInput) {
                dateInput.style.cssText = getClickUpDeadlineStyle(task.dueDate);
            }
        }

        function changeClickUpStatus(taskId, selectEl) {
            const task = clickUpTasks.find(function (t) { return t.id === taskId; });
            const previous = task ? task.status.name : '';
            applyClickUpUpdate(taskId, { status: selectEl.value }, selectEl, previous, 'status');
        }

        function changeClickUpPriority(taskId, selectEl) {
            const task = clickUpTasks.find(function (t) { return t.id === taskId; });
            const previous = task && task.priority ? String(task.priority) : '';
            const value = selectEl.value === '' ? null : parseInt(selectEl.value, 10);
            applyClickUpUpdate(taskId, { priority: value }, selectEl, previous, 'priority');
        }

        function changeClickUpDeadline(taskId, inputEl) {
            const task = clickUpTasks.find(function (t) { return t.id === taskId; });
            const previous = task && task.dueDate ? toDateInputValue(task.dueDate) : '';

            let timestamp = null;
            if (inputEl.value) {
                const parts = inputEl.value.split('-');
                // Local noon keeps the date stable regardless of the workspace timezone offset
                timestamp = new Date(
                    parseInt(parts[0], 10),
                    parseInt(parts[1], 10) - 1,
                    parseInt(parts[2], 10),
                    12, 0, 0
                ).getTime();
            }

            applyClickUpUpdate(taskId, { dueDate: timestamp }, inputEl, previous, 'dueDate');
        }

        // ==========================================
        // ====== ClickUp Task Details JS ===========
        // ==========================================
        let clickUpDetailsTaskId = null;

        function openClickUpDetails(taskId) {
            if (!clickUpHasToken) {
                alert('ClickUp не підключено. Підключіть його спочатку у вкладці ClickUp.');
                return;
            }

            clickUpDetailsTaskId = taskId;
            const task = clickUpTasks.find(function (t) { return t.id === taskId; });

            document.getElementById('clickUpDetailsTitle').innerText = task ? task.name : 'Деталі задачі';
            document.getElementById('clickUpDetailsBody').innerHTML = '';
            document.getElementById('clickUpDetailsLoader').style.display = 'block';
            document.getElementById('clickUpDetailsOpenLink').href = task ? task.url : '#';
            document.getElementById('clickUpDetailsModal').classList.add('active');

            document.getElementById('clickUpDetailsCommentsBtn').onclick = function () {
                closeClickUpDetails();
                openClickUpComments(taskId);
            };
            document.getElementById('clickUpDetailsBriefBtn').onclick = function () {
                aiClickUpBrief(taskId);
            };
            document.getElementById('clickUpDetailsToLocalBtn').onclick = function () {
                createLocalTaskFromClickUp(taskId);
            };

            google.script.run
                .withSuccessHandler(function (details) {
                    document.getElementById('clickUpDetailsLoader').style.display = 'none';
                    if (clickUpDetailsTaskId !== taskId) return; // Modal was closed or switched
                    renderClickUpDetails(details);
                })
                .withFailureHandler(function (err) {
                    document.getElementById('clickUpDetailsLoader').style.display = 'none';
                    document.getElementById('clickUpDetailsBody').innerHTML =
                        '<div style="color: var(--danger); font-size: 0.85rem; padding: 1rem 0;">Не вдалося завантажити деталі: ' +
                        escapeHtml(err.message || String(err)) + '</div>';
                })
                .getClickUpTaskDetails(taskId, null);
