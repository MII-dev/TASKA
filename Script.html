    <script>
        let allTasks = [];
        let projectsData = [];
        let currentProjectDetailId = null;
        let currentView = 'list';

        function loadTasks() {
            document.getElementById('dashboardStats').style.display = 'flex';
            google.script.run
                .withSuccessHandler(tasks => {
                    allTasks = tasks || [];
                    updateDashboard();
                    filterTasks();
                    // Keep an open project detail view (branch task lists, counts) in sync
                    if (currentProjectDetailId) {
                        const project = projectsData.find(p => p.ID === currentProjectDetailId);
                        if (project) renderProjectDetail(project);
                    }
                })
                .withFailureHandler(err => {
                    alert('Помилка завантаження: ' + err);
                })
                .getTasks();
        }

        function loadProjects() {
            google.script.run
                .withSuccessHandler(projects => {
                    projectsData = projects || [];
                    // Task cards show project/branch badges — re-render so they pick up the data
                    filterTasks();
                    renderProjectsDashboard();
                })
                .withFailureHandler(err => {
                    console.error('Помилка завантаження проєктів: ' + err);
                })
                .getProjects();
        }

        /**
         * Small "🗂️ Проєкт / Гілка" pill shown on a task card when the task
         * is linked to a project. Shared by both list and kanban card templates.
         */
        function getTaskProjectBadgeHtml(task) {
            if (!task['Проєкт']) return '';
            const project = projectsData.find(p => p.ID === task['Проєкт']);
            if (!project) return '';
            const branch = (project.Гілки || []).find(b => b.id === task['Гілка']);
            const label = branch ? `${project.Назва} / ${branch.name}` : project.Назва;
            return `<span class="tag-category tag-category-accent" title="Проєкт">🗂️ ${label}</span>`;
        }

        function updateDashboard() {
            const activeCount = allTasks.filter(t => t.Статус !== 'Виконано').length;
            const doneCount = allTasks.filter(t => t.Статус === 'Виконано').length;

            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const overdueCount = allTasks.filter(t => {
                if (t.Статус === 'Виконано' || !t.Дедлайн) return false;
                const d = new Date(t.Дедлайн);
                return d < today;
            }).length;

            document.getElementById('statActive').innerText = activeCount;
            document.getElementById('statDone').innerText = doneCount;
            document.getElementById('statOverdue').innerText = overdueCount;
        }

        function setViewMode(mode) {
            currentView = mode;
            document.getElementById('btnListView').style.background = mode === 'list' ? 'var(--bg-card-hover)' : 'transparent';
            document.getElementById('btnKanbanView').style.background = mode === 'kanban' ? 'var(--bg-card-hover)' : 'transparent';

            document.getElementById('taskList').style.display = mode === 'list' ? 'flex' : 'none';
            document.getElementById('kanbanBoard').style.display = mode === 'kanban' ? 'grid' : 'none';

            filterTasks();
        }

        function filterTasks() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;
            const sort = document.getElementById('sortFilter').value;

            let filtered = allTasks.filter(t => {
                const title = (t.Назва || '').toString().toLowerCase();
                const desc = (t.Опис || '').toString().toLowerCase();
                const matchesSearch = title.includes(query) || desc.includes(query);

                let matchesStatus = false;
                if (status === 'active') {
                    matchesStatus = t.Статус !== 'Виконано';
                } else if (status === 'all') {
                    matchesStatus = true;
                } else {
                    matchesStatus = t.Статус === status;
                }

                return matchesSearch && matchesStatus;
            });

            if (sort === 'deadline') {
                filtered.sort((a, b) => {
                    if (!a.Дедлайн) return 1;
                    if (!b.Дедлайн) return -1;
                    return new Date(a.Дедлайн) - new Date(b.Дедлайн);
                });
            } else if (sort === 'priority') {
                const pMap = { 'Високий': 1, 'Середній': 2, 'Низький': 3 };
                filtered.sort((a, b) => (pMap[a.Пріоритет] || 4) - (pMap[b.Пріоритет] || 4));
            } else {
                // Default and 'newest': sort from newest to oldest by creation date
                filtered.sort((a, b) => new Date(b['Дата створення'] || 0) - new Date(a['Дата створення'] || 0));
            }

            if (currentView === 'list') {
                renderTasks(filtered);
            } else {
                renderKanban(filtered);
            }
        }

        function getDeadlineClass(dateStr, status) {
            if (!dateStr || status === 'Виконано') return '';
            const d = new Date(dateStr);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            if (d < today) return 'text-overdue';
            if (d.getTime() === today.getTime()) return 'text-today';
            return '';
        }

        function getPriorityClass(priority) {
            if (!priority) return '';
            return 'priority-' + priority;
        }

        function generateCardHTML(task, index, draggable = false) {
            const dragAttr = draggable ? `draggable="true" ondragstart="dragStart(event, '${task.ID}')"` : '';

            // For kanban view, use a slightly expanded card layout
            if (draggable) {
                return generateKanbanCardHTML(task, index, dragAttr);
            }

            const steps = task.Кроки || [];
            const stepsHtml = steps.length > 0 ? `
                <span class="tag-category tag-category-success">
                    🧩 Кроки: ${steps.filter(s => s.done).length}/${steps.length}
                </span>
            ` : '';

            // Mini steps list on card
            let miniStepsHtml = '';
            if (steps.length > 0) {
                miniStepsHtml = `
                    <div class="card-steps-list" onclick="event.stopPropagation()">
                        ${steps.map((s, sIdx) => `
                            <label class="card-step-item ${s.done ? 'is-done' : ''}">
                                <input type="checkbox" class="card-step-checkbox" ${s.done ? 'checked' : ''} onchange="toggleStepInline('${task.ID}', ${sIdx}, this)">
                                <span class="card-step-text">${s.text}</span>
                            </label>
                        `).join('')}
                    </div>
                `;
            }

            // Compact list view — two rows: info + notes
            return `
                <div class="task-card ${getPriorityClass(task.Пріоритет)}" style="animation-delay: ${index * 0.03}s; flex-direction: column; align-items: stretch; gap: 0;" onclick="editTask('${task.ID}')" ${dragAttr} title="${(task.Опис || '').replace(/"/g, '&quot;')}">
                    <div style="display: flex; align-items: center; gap: 0.75rem;">
                        <div class="task-header">
                            <div class="task-title">${task.Назва}</div>
                            ${task.Тип ? `<span class="tag-category">${task.Тип}</span>` : ''}
                            ${getTaskProjectBadgeHtml(task)}
                            ${stepsHtml}
                            <span class="badge ${getBadgeClass(task.Статус)}">${task.Статус}</span>
                        </div>
                        <div class="task-meta">
                            <span class="${getDeadlineClass(task.Дедлайн, task.Статус)}">📅 ${formatDate(task.Дедлайн)}</span>
                            ${task['Дата виконання'] ? `<span class="text-done-accent">✅ ${formatDate(task['Дата виконання'])}</span>` : ''}
                            ${task.Виконавець ? `<span class="tag-assignee">👤 ${task.Виконавець}</span>` : '<span class="tag-assignee">👤 Я</span>'}
                        </div>
                        <div class="card-actions">
                            ${task['Посилання на результат'] ? `
                                <a class="card-result-link" href="${task['Посилання на результат']}" target="_blank" onclick="event.stopPropagation()" title="Переглянути результат">
                                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                                </a>
                            ` : ''}
                            ${task.Статус !== 'Виконано' ? `
                                <button class="btn btn-outline btn-done-sm" onclick="event.stopPropagation(); markAsDone('${task.ID}', this)">
                                    ✅ Виконати
                                </button>
                            ` : ''}
                        </div>
                    </div>
                    ${miniStepsHtml}
                    <textarea class="inline-notes" placeholder="Нотатки..." onclick="event.stopPropagation()" onchange="saveInlineNotes('${task.ID}', this)">${task.Коментарі || ''}</textarea>
                </div>
            `;
        }

        function generateKanbanCardHTML(task, index, dragAttr) {
            const steps = task.Кроки || [];
            const stepsHtml = steps.length > 0 ? `
                <span class="tag-category tag-category-success">
                    🧩 Кроки: ${steps.filter(s => s.done).length}/${steps.length}
                </span>
            ` : '';

            // Mini steps list on card
            let miniStepsHtml = '';
            if (steps.length > 0) {
                miniStepsHtml = `
                    <div class="card-steps-list" onclick="event.stopPropagation()">
                        ${steps.map((s, sIdx) => `
                            <label class="card-step-item ${s.done ? 'is-done' : ''}">
                                <input type="checkbox" class="card-step-checkbox" ${s.done ? 'checked' : ''} onchange="toggleStepInline('${task.ID}', ${sIdx}, this)">
                                <span class="card-step-text">${s.text}</span>
                            </label>
                        `).join('')}
                    </div>
                `;
            }

            return `
                <div class="task-card ${getPriorityClass(task.Пріоритет)}" style="animation-delay: ${index * 0.03}s; flex-direction: column; align-items: stretch;" onclick="editTask('${task.ID}')" ${dragAttr}>
                    <div class="task-header" style="margin-bottom: 0.25rem;">
                        <div class="task-title" style="white-space: normal;">${task.Назва}</div>
                    </div>
                    <div style="margin-bottom: 0.3rem; display: flex; gap: 4px; flex-wrap: wrap;">
                        ${task.Тип ? `<span class="tag-category">${task.Тип}</span>` : ''}
                        ${getTaskProjectBadgeHtml(task)}
                        ${stepsHtml}
                    </div>
                    ${miniStepsHtml}
                    <div class="task-meta" style="flex-wrap: wrap;">
                        <span class="${getDeadlineClass(task.Дедлайн, task.Статус)}">📅 ${formatDate(task.Дедлайн)}</span>
                        ${task.Виконавець ? `<span class="tag-assignee">👤 ${task.Виконавець}</span>` : '<span class="tag-assignee">👤 Я</span>'}
                    </div>
                    <div style="margin-top: 0.3rem; border-top: 1px dashed var(--border); padding-top: 0.3rem;">
                        <textarea class="inline-notes" placeholder="Нотатки..." onclick="event.stopPropagation()" onchange="saveInlineNotes('${task.ID}', this)">${task.Коментарі || ''}</textarea>
                    </div>
                    ${task.Статус !== 'Виконано' ? `
                        <div style="display: flex; justify-content: flex-end; margin-top: 0.25rem;">
                            <button class="btn btn-outline btn-done-sm" onclick="event.stopPropagation(); markAsDone('${task.ID}', this)">
                                ✅ Виконати
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function saveInlineNotes(id, textarea) {
            const task = allTasks.find(t => t.ID === id);
            if (!task) return;

            const newNotes = textarea.value.trim();
            if (task.Коментарі === newNotes) return; // No change

            task.Коментарі = newNotes;

            const originalBorder = textarea.style.borderColor;
            textarea.style.borderColor = 'var(--status-done-text)';

            google.script.run
                .withSuccessHandler(() => {
                    setTimeout(() => textarea.style.borderColor = originalBorder, 1500);
                })
                .withFailureHandler(err => {
                    alert('Помилка збереження нотаток: ' + err);
                    textarea.style.borderColor = 'var(--danger)';
                })
                .saveTask(task);
        }

        function toggleStepInline(taskId, index, checkbox) {
            const doneState = checkbox.checked;
            const labelNode = checkbox.parentElement;

            if (doneState) {
                labelNode.style.textDecoration = 'line-through';
                labelNode.style.color = 'var(--text-muted)';
            } else {
                labelNode.style.textDecoration = 'none';
                labelNode.style.color = 'var(--text-main)';
            }

            const task = allTasks.find(t => t.ID === taskId);
            if (!task) return;
            task.Кроки[index].done = doneState;

            // Update progress badge on the card immediately
            const cardElement = checkbox.closest('.task-card');
            if (cardElement) {
                const stepsBadge = cardElement.querySelector('.tag-category');
                if (stepsBadge && stepsBadge.textContent.includes('Кроки:')) {
                    const doneCount = task.Кроки.filter(s => s.done).length;
                    stepsBadge.innerHTML = `🧩 Кроки: ${doneCount}/${task.Кроки.length}`;
                }
            }

            google.script.run
                .withSuccessHandler(() => {
                    updateDashboard();
                })
                .withFailureHandler(err => {
                    alert('Помилка оновлення стану кроку: ' + err);
                    checkbox.checked = !checkbox.checked;
                    labelNode.style.textDecoration = checkbox.checked ? 'line-through' : 'none';
                    labelNode.style.color = checkbox.checked ? 'var(--text-muted)' : 'var(--text-main)';
                })
                .saveTaskSteps(taskId, task.Кроки);
        }

        function renderTasks(tasks) {
            const list = document.getElementById('taskList');
            if (!tasks || tasks.length === 0) {
                list.innerHTML = `<div class="empty-state">
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                    <h3>Задач поки немає</h3>
                    <p>Створіть свою першу задачу, щоб почати роботу!</p>
                </div>`;
                return;
            }
            list.innerHTML = tasks.map((task, index) => generateCardHTML(task, index, false)).join('');
        }

        function renderKanban(tasks) {
            const board = document.getElementById('kanbanBoard');
            const columns = ['Нова', 'В роботі', 'На перевірці', 'Виконано'];

            let html = '';
            columns.forEach(col => {
                const colTasks = tasks.filter(t => t.Статус === col);
                html += `
                    <div class="kanban-column" ondrop="drop(event, '${col}')" ondragover="allowDrop(event)">
                        <div class="kanban-header">
                            <span>${col}</span>
                            <span class="kanban-count">${colTasks.length}</span>
                        </div>
                        <div class="kanban-tasks">
                            ${colTasks.map((task, index) => generateCardHTML(task, index, true)).join('')}
                        </div>
                    </div>
                `;
            });
            board.innerHTML = html;
        }

        function allowDrop(ev) { ev.preventDefault(); }
        function dragStart(ev, id) { ev.dataTransfer.setData("taskId", id); }
        function drop(ev, newStatus) {
            ev.preventDefault();
            const id = ev.dataTransfer.getData("taskId");
            const task = allTasks.find(t => t.ID === id);

            if (task && task.Статус !== newStatus) {
                task.Статус = newStatus;
                task['Дата виконання'] = newStatus === 'Виконано' ? new Date().toISOString() : '';

                updateDashboard();
                filterTasks();

                google.script.run
                    .withFailureHandler(err => {
                        alert('Помилка оновлення статусу: ' + err);
                        loadTasks();
                    })
                    .saveTask(task);
            }
        }

        function getBadgeClass(status) {
            switch (status) {
                case 'Нова': return 'badge-new';
                case 'В роботі': return 'badge-progress';
                case 'На перевірці': return 'badge-review';
                case 'Виконано': return 'badge-done';
                default: return '';
            }
        }

        function getProjectBadgeClass(status) {
            switch (status) {
                case 'Активний': return 'badge-new';
                case 'На паузі': return 'badge-progress';
                case 'Завершено': return 'badge-done';
                case 'Архів': return 'badge-archived';
                default: return '';
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'Немає';
            const d = new Date(dateStr);
            return d.toLocaleDateString('uk-UA');
        }

        /**
         * "сьогодні" / "вчора" / "N дн. тому" / "N тижн. тому" / "N міс. тому" —
         * used for the project "last updated" indicator, where a relative
         * label makes staleness obvious at a glance faster than a raw date.
         */
        function formatRelativeTime(dateStr) {
            if (!dateStr) return 'ніколи';
            const d = new Date(dateStr);
            if (isNaN(d)) return 'ніколи';

            const startOfDay = date => new Date(date.getFullYear(), date.getMonth(), date.getDate());
            const days = Math.round((startOfDay(new Date()) - startOfDay(d)) / (1000 * 60 * 60 * 24));

            if (days <= 0) return 'сьогодні';
            if (days === 1) return 'вчора';
            if (days < 7) return `${days} дн. тому`;
            if (days < 30) return `${Math.round(days / 7)} тижн. тому`;
            return `${Math.round(days / 30)} міс. тому`;
        }

        const PROJECT_STALE_WARN_DAYS = 2;
        const PROJECT_STALE_DANGER_DAYS = 5;

        /**
         * Staleness class for the "last updated" label — same red/yellow accents
         * getDeadlineClass() uses for overdue/due-today deadlines.
         */
        function getProjectStalenessClass(dateStr) {
            if (!dateStr) return 'text-overdue';
            const d = new Date(dateStr);
            if (isNaN(d)) return '';
            const days = Math.round((new Date() - d) / (1000 * 60 * 60 * 24));
            if (days >= PROJECT_STALE_DANGER_DAYS) return 'text-overdue';
            if (days >= PROJECT_STALE_WARN_DAYS) return 'text-today';
            return '';
        }

        function openModal(taskId = null) {
            const modal = document.getElementById('taskModal');
            const form = document.getElementById('taskForm');
            const title = document.getElementById('modalTitle');
            form.reset();
            document.getElementById('taskId').value = '';

            const stepsGroup = document.getElementById('stepsGroup');
            const stepsContainer = document.getElementById('stepsContainer');
            stepsContainer.innerHTML = '';

            stepsGroup.style.display = 'block';

            populateTaskProjectOptions();

            if (taskId) {
                title.innerText = 'Редагувати задачу';
                document.getElementById('deleteBtn').hidden = false;
                const task = allTasks.find(t => t.ID === taskId);
                document.getElementById('taskId').value = task.ID;
                document.getElementById('title').value = task.Назва;
                document.getElementById('description').value = task.Опис;
                document.getElementById('assignee').value = task.Виконавець;
                document.getElementById('status').value = task.Статус;
                document.getElementById('priority').value = task.Пріоритет || 'Середній';
                document.getElementById('category').value = task.Тип || '';
                document.getElementById('resultLink').value = task['Посилання на результат'] || '';
                document.getElementById('comments').value = task.Коментарі || '';
                if (task.Дедлайн) {
                    const d = new Date(task.Дедлайн);
                    if (!isNaN(d)) {
                        // toDateInputValue() reads local date components — using toISOString()
                        // here instead shifted the date back a day for any UTC+ timezone,
                        // since task.Дедлайн already came back from the server as a UTC ISO string.
                        document.getElementById('deadline').value = toDateInputValue(d);
                    }
                }
                document.getElementById('taskProject').value = task['Проєкт'] || '';
                populateTaskBranchOptions();
                document.getElementById('taskBranch').value = task['Гілка'] || '';
                modalSteps = task.Кроки || [];
                renderModalSteps(modalSteps, task.ID);
            } else {
                title.innerText = 'Створити задачу';
                document.getElementById('deleteBtn').hidden = true;
                document.getElementById('priority').value = 'Середній';
                document.getElementById('category').value = '';
                document.getElementById('taskProject').value = '';
                populateTaskBranchOptions();
                modalSteps = [];
                renderModalSteps(modalSteps, null);
            }

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('taskModal').classList.remove('active');
        }

        function handleOutsideClick(event) {
            const modalOverlay = document.getElementById('taskModal');
            if (event.target === modalOverlay) {
                closeModal();
            }
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerHTML = '<div class="loader" style="width: 16px; height: 16px; border-width: 2px;"></div> Збереження...';

            const existingTask = allTasks.find(t => t.ID === document.getElementById('taskId').value);
            const status = document.getElementById('status').value;
            let doneDate = '';

            if (status === 'Виконано') {
                doneDate = (existingTask && existingTask['Дата виконання']) ? existingTask['Дата виконання'] : new Date().toISOString();
            }

            const task = {
                ID: document.getElementById('taskId').value,
                'Назва': document.getElementById('title').value,
                'Опис': document.getElementById('description').value,
                'Виконавець': document.getElementById('assignee').value,
                'Дедлайн': document.getElementById('deadline').value,
                'Статус': status,
                'Пріоритет': document.getElementById('priority').value,
                'Тип': document.getElementById('category').value,
                'Коментарі': document.getElementById('comments').value,
                'Посилання на результат': document.getElementById('resultLink').value,
                'Дата виконання': doneDate,
                'Кроки': modalSteps,
                'Проєкт': document.getElementById('taskProject').value,
                'Гілка': document.getElementById('taskBranch').value
            };

            google.script.run
                .withSuccessHandler(() => {
                    closeModal();
                    loadTasks();
                    btn.disabled = false;
                    btn.innerText = 'Зберегти';
                })
                .withFailureHandler(err => {
                    alert('Помилка збереження: ' + err);
                    btn.disabled = false;
                    btn.innerText = 'Зберегти';
                })
                .saveTask(task);
        }

        function editTask(id) {
            openModal(id);
        }

        function markAsDone(id, btnElement) {
            if (!confirm('Позначити задачу як виконану?')) return;

            const originalText = btnElement.innerHTML;
            btnElement.disabled = true;
            btnElement.innerHTML = '<div class="loader" style="width: 12px; height: 12px; border-width: 2px; border-bottom-color: #10b981;"></div>';

            const task = allTasks.find(t => t.ID === id);
            if (!task) return;

            task.Статус = 'Виконано';
            task['Дата виконання'] = new Date().toISOString();

            google.script.run
                .withSuccessHandler(() => {
                    loadTasks();
                })
                .withFailureHandler(err => {
                    alert('Помилка оновлення: ' + err);
                    btnElement.disabled = false;
                    btnElement.innerHTML = originalText;
                })
                .saveTask(task);
        }

        function handleDelete() {
            const id = document.getElementById('taskId').value;
            if (!id) return;

            if (confirm('Ви впевнені, що хочете видалити цю задачу?')) {
                const btn = document.getElementById('deleteBtn');
                btn.disabled = true;
                btn.innerHTML = '<div class="loader" style="width: 16px; height: 16px; border-width: 2px;"></div> Видалення...';

                google.script.run
                    .withSuccessHandler(() => {
                        closeModal();
                        loadTasks();
                        btn.disabled = false;
                        btn.innerHTML = '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6"></path></svg> Видалити';
                    })
                    .withFailureHandler(err => {

        function renderCalendarEvents() {
            const container = document.getElementById('calendarEventsList');

            if (!calendarEvents || calendarEvents.length === 0) {
                const emptyMsg = calendarMode === 'today' ? 'Сьогодні подій немає' : 'На цьому тижні подій немає';
                container.innerHTML = `<div class="calendar-empty"><div class="calendar-empty-icon">🎉</div>${emptyMsg}<br><span style="font-size: 0.72rem; opacity: 0.6;">Вільний час для продуктивності!</span></div>`;
                return;
            }

            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

            // Group events by day
            const grouped = {};
            calendarEvents.forEach(function (ev) {
                const evDate = new Date(ev.start);
                const dayKey = evDate.toLocaleDateString('uk-UA', { weekday: 'short', day: 'numeric', month: 'short' });
                if (!grouped[dayKey]) grouped[dayKey] = { events: [], date: new Date(evDate.getFullYear(), evDate.getMonth(), evDate.getDate()) };
                grouped[dayKey].events.push(ev);
            });

            let html = '';
            Object.keys(grouped).forEach(function (dayKey) {
                const group = grouped[dayKey];
                const isToday = group.date.getTime() === today.getTime();

                if (calendarMode === 'week') {
                    html += `<div class="calendar-day-divider ${isToday ? 'today' : ''}">${isToday ? '📌 Сьогодні' : dayKey}</div>`;
                }

                group.events.forEach(function (ev) {
                    // Our own auto-synced task-deadline markers, not real meetings —
                    // rendered as a quiet badge, not editable/joinable/briefable here.
                    const isDeadlineSync = !!(ev.description && ev.description.indexOf('[TaskApp:deadline-sync]') === 0);

                    if (isDeadlineSync) {
                        html += `
                            <div class="calendar-event calendar-event-deadline" title="Синхронізовано з дедлайном задачі">
                                <div class="event-time-block"><span class="event-time-allday">📋</span></div>
                                <div class="event-info">
                                    <div class="event-title">${ev.title.replace(/^📋\s*/, '')}</div>
                                </div>
                            </div>
                        `;
                        return;
                    }

                    const isNow = !ev.isAllDay && new Date(ev.start) <= now && new Date(ev.end) > now;
                    const nowClass = isNow ? 'event-now' : '';

                    let timeBlock;
                    if (ev.isAllDay) {
                        timeBlock = '<span class="event-time-allday">Весь день</span>';
                    } else {
                        const startTime = new Date(ev.start).toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
                        const endTime = new Date(ev.end).toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
                        timeBlock = `<span class="event-time-start">${startTime}</span><span class="event-time-end">${endTime}</span>`;
                    }

                    const locationHtml = ev.location ? `<div class="event-location"><svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>${ev.location}</div>` : '';

                    // Detect meeting links: conferenceData from API, then fallback to text search
                    let meetLink = null;
                    if (ev.hangoutLink) {
                        const cType = getMeetingType(ev.hangoutLink);
                        meetLink = { url: ev.hangoutLink, type: cType, label: ev.conferenceName || 'Приєднатися' };
                    } else {
                        meetLink = extractMeetingLink((ev.description || '') + ' ' + (ev.htmlDescription || '') + ' ' + (ev.location || ''));
                    }
                    let actionsHtml = '<div class="event-actions">';
                    if (meetLink) {
                        actionsHtml += `<a href="${meetLink.url}" target="_blank" class="event-join-btn ${meetLink.type}" onclick="event.stopPropagation()" title="${meetLink.url}"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>${meetLink.label}</a>`;
                    }
                    // Titles go into data attributes, not into a JS string built by
                    // concatenation — a backslash or quote in a title used to break the handler
                    actionsHtml += `<button class="event-join-btn generic js-ai-brief" data-event-title="${escapeHtml(ev.title)}" data-event-start="${escapeHtml(ev.start)}" title="Підготуватися до зустрічі з ШІ">✨ AI Бриф</button>`;
                    actionsHtml += '</div>';

                    html += `
                        <div class="calendar-event ${nowClass}" style="border-left-color: ${ev.color}; cursor: pointer;"
                            title="${ev.calendarName} — клацни, щоб редагувати"
                            onclick="openEventForEditById('${escapeHtml(ev.eventId)}')">
                            <div class="event-time-block">${timeBlock}</div>
                            <div class="event-info">
                                <div class="event-title">${ev.title}</div>
                                ${locationHtml}
                                ${actionsHtml}
                            </div>
                        </div>
                    `;
                });
            });

            container.innerHTML = html;

            container.querySelectorAll('.js-ai-brief').forEach(function (btn) {
                btn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    aiPrepMeeting(btn.dataset.eventTitle, btn.dataset.eventStart);
                });
            });
        }

        /**
         * Determines meeting type CSS class from URL.
         */
        function getMeetingType(url) {
            if (!url) return 'generic';
            if (/meet\.google\.com/i.test(url)) return 'meet';
            if (/zoom\.us/i.test(url)) return 'zoom';
            if (/teams\.microsoft\.com|teams\.live\.com/i.test(url)) return 'teams';
            return 'generic';
        }

        /**
         * Extracts meeting/call link from text.
         * Supports: Google Meet, Zoom, Microsoft Teams, Webex, Skype
         */
        function extractMeetingLink(text) {
            if (!text) return null;

            const patterns = [
                { regex: /https:\/\/meet\.google\.com\/[a-z\-]+/i, type: 'meet', label: 'Google Meet' },
                { regex: /https:\/\/[a-z0-9]*\.?zoom\.us\/[jw]\/[^\s"<)']+/i, type: 'zoom', label: 'Zoom' },
                { regex: /https:\/\/teams\.microsoft\.com\/meet\/[^\s"<)']+/i, type: 'teams', label: 'Teams' },
                { regex: /https:\/\/teams\.microsoft\.com\/l\/meetup-join\/[^\s"<)']+/i, type: 'teams', label: 'Teams' },
                { regex: /https:\/\/teams\.microsoft\.com\/[^\s"<)']*meet[^\s"<)']+/i, type: 'teams', label: 'Teams' },
                { regex: /https:\/\/teams\.live\.com\/meet\/[^\s"<)']+/i, type: 'teams', label: 'Teams' },
                { regex: /https:\/\/[a-z0-9]*\.?webex\.com\/[^\s"<)']+/i, type: 'generic', label: 'Webex' },
                { regex: /https:\/\/join\.skype\.com\/[^\s"<)']+/i, type: 'generic', label: 'Skype' },
                { regex: /https:\/\/meet\.jit\.si\/[^\s"<)']+/i, type: 'meet', label: 'Jitsi' },
            ];

            for (const p of patterns) {
                const match = text.match(p.regex);
                if (match) {
                    return { url: match[0], type: p.type, label: p.label };
                }
            }
            return null;
        }

        function openEventModal(existingEvent) {
            const modal = document.getElementById('eventModal');
            document.getElementById('eventForm').reset();
            document.getElementById('eventStartTimeGroup').style.display = '';
            document.getElementById('eventEndTimeGroup').style.display = '';

            const deleteBtn = document.getElementById('deleteEventBtn');

            if (existingEvent) {
                editingEventId = existingEvent.eventId;
                document.getElementById('eventModalTitle').innerText = 'Редагувати подію';
                document.getElementById('saveEventBtnText').innerText = 'Зберегти зміни';
                deleteBtn.hidden = false;

                document.getElementById('eventTitle').value = existingEvent.title;
                document.getElementById('eventAllDay').checked = existingEvent.isAllDay;

                const start = new Date(existingEvent.start);
                const end = new Date(existingEvent.end);
                document.getElementById('eventStartDate').value = toDateInputValue(start);

                if (existingEvent.isAllDay) {
                    // Calendar stores the all-day end date exclusive (start+1 for a
                    // single day) — shift back so the form shows the real last day.
                    const inclusiveEnd = new Date(end);
                    inclusiveEnd.setDate(inclusiveEnd.getDate() - 1);
                    document.getElementById('eventEndDate').value = toDateInputValue(inclusiveEnd);
                } else {
                    document.getElementById('eventEndDate').value = toDateInputValue(end);
                    document.getElementById('eventStartTime').value = start.toTimeString().slice(0, 5);
                    document.getElementById('eventEndTime').value = end.toTimeString().slice(0, 5);
                }

                document.getElementById('eventLocation').value = existingEvent.location || '';
                document.getElementById('eventDescription').value = existingEvent.description || '';
                toggleAllDay();
            } else {
                editingEventId = null;
                document.getElementById('eventModalTitle').innerText = 'Нова подія в календарі';
                document.getElementById('saveEventBtnText').innerText = 'Створити подію';
                deleteBtn.hidden = true;

                document.getElementById('eventEndDate').value = today;
                document.getElementById('eventStartTime').value = '09:00';
                document.getElementById('eventEndTime').value = '10:00';

        /**
         * Records a turn in the history sent back to the model, keeping it bounded.
         */
        function pushChatHistory(userText, modelText) {
            chatHistory.push({ role: 'user', text: userText });
            chatHistory.push({ role: 'model', text: modelText });
            if (chatHistory.length > 20) {
                chatHistory = chatHistory.slice(chatHistory.length - 20);

        function sendAiChatMessage() {
            const input = document.getElementById('aiChatInput');
            const message = input.value.trim();
            if (!message) return;

            input.value = '';
            addAiMsg(message, 'user');
            showAiTyping();

            google.script.run
                .withSuccessHandler(response => {
                    hideAiTyping();

                    if (response.text) {
                        addAiMsg(response.text, 'bot');
                        pushChatHistory(message, response.text);
                    }

                    (response.actions || []).forEach(function (item) {
                        renderAiActionCard(item.action, item.data);
                    });
                })
                .withFailureHandler(err => {
                    hideAiTyping();
                    addAiMsg('Вибачте, виникла помилка: ' + (err.message || String(err)), 'bot');
                })
                .aiChat(message, chatHistory);

        function addAiMsg(text, sender) {

            msgDiv.className = 'ai-msg ai-msg-' + sender;

            if (sender === 'bot') {

        // ==========================================
        // ====== AI Action Confirmation Cards ======
        // ==========================================

        const AI_ACTION_META = {
            createTask: { title: '➕ Створення задачі', confirm: 'Створити', danger: false },
            updateTask: { title: '✏️ Зміна задачі', confirm: 'Застосувати', danger: false },
            deleteTask: { title: '🗑️ Видалення задачі', confirm: 'Видалити', danger: true },
            createEvent: { title: '📅 Нова подія в календарі', confirm: 'Створити подію', danger: false },
            decomposeTask: { title: '🧩 Розбити на кроки', confirm: 'Розбити', danger: false }
        };

        /**
         * Renders a row of the action card. All values come from model output,
         * so everything goes through escapeHtml.
         */
        function aiCardRow(label, value) {
            if (value === undefined || value === null || value === '') return '';
            return '<div><strong>' + escapeHtml(label) + ':</strong> ' + escapeHtml(String(value)) + '</div>';
        }

        /**
         * Renders a before → after row for updates.
         */
        function aiCardDiffRow(label, before, after) {
            const beforeText = (before === undefined || before === null || before === '') ? '—' : String(before);
            return '<div><strong>' + escapeHtml(label) + ':</strong> ' +
                '<span style="color: var(--text-muted); text-decoration: line-through;">' + escapeHtml(beforeText) + '</span>' +
                ' <span style="color: var(--text-muted);">→</span> ' +
                '<span style="color: var(--status-done-text); font-weight: 600;">' + escapeHtml(String(after)) + '</span></div>';
        }

        /**
         * Builds the body of the confirmation card for a proposed action.
         * Returns null when the action cannot be shown (e.g. task no longer exists).
         */
        function buildAiActionBody(action, data) {
            if (action === 'createTask') {
                return aiCardRow('Назва', data['Назва']) +
                    aiCardRow('Опис', data['Опис']) +
                    aiCardRow('Дедлайн', data['Дедлайн']) +
                    aiCardRow('Пріоритет', data['Пріоритет']) +
                    aiCardRow('Тип', data['Тип']) +
                    aiCardRow('Виконавець', data['Виконавець']);
            }

            if (action === 'updateTask' || action === 'deleteTask' || action === 'decomposeTask') {
                const task = allTasks.find(function (t) { return t.ID === data.ID; });
                if (!task) return null;

                if (action === 'deleteTask') {
                    return '<div>Задача: <strong>' + escapeHtml(task.Назва || '') + '</strong></div>' +
                        '<div style="color: var(--danger); font-size: 0.8rem;">Цю дію не можна скасувати.</div>';
                }
                if (action === 'decomposeTask') {
                    return '<div>Задача: <strong>' + escapeHtml(task.Назва || '') + '</strong></div>' +
                        (task.Кроки && task.Кроки.length > 0
                            ? '<div style="color: var(--status-prog-text); font-size: 0.8rem;">Наявні ' + task.Кроки.length + ' кроків буде замінено.</div>'
                            : '');
                }

                // updateTask — show only what actually changes
                let rows = '<div style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 2px;">' +
                    escapeHtml(task.Назва || '') + '</div>';
                let changeCount = 0;

                Object.keys(data).forEach(function (key) {
                    if (key === 'ID') return;
                    if (String(task[key] || '') === String(data[key])) return;
                    rows += aiCardDiffRow(key, task[key], data[key]);
                    changeCount++;
                });

                if (changeCount === 0) return null; // Model proposed a no-op
                return rows;
            }

            if (action === 'createEvent') {
                const when = data.isAllDay
                    ? data.startDate + ' (весь день)'
                    : data.startDate + ' ' + data.startTime + ' – ' +
                      (data.endDate !== data.startDate ? data.endDate + ' ' : '') + data.endTime;

                return aiCardRow('Назва', data.title) +
                    aiCardRow('Коли', when) +
                    aiCardRow('Місце', data.location) +
                    aiCardRow('Опис', data.description);
            }

            return null;
        }

        /**
         * Shows a proposed action with Confirm / Cancel. Nothing is applied until
         * the user confirms — the assistant never writes silently.
         */
        function renderAiActionCard(action, data) {
            const meta = AI_ACTION_META[action];
            if (!meta) return;

            const body = buildAiActionBody(action, data);
            if (body === null) {
                addAiMsg('Не вдалося підготувати дію: задачу не знайдено або змінювати нічого.', 'bot');
                return;
            }

            const msgsContainer = document.getElementById('aiChatMessages');
            const card = document.createElement('div');
            card.className = 'ai-action-card';
            if (meta.danger) {
                card.style.background = 'rgba(242, 104, 92, 0.08)';
                card.style.borderColor = 'rgba(242, 104, 92, 0.3)';
            }

            const confirmStyle = meta.danger
                ? 'background: rgba(242, 104, 92, 0.15); color: var(--danger); border-color: rgba(242, 104, 92, 0.4);'
                : '';

            card.innerHTML =
                '<div class="ai-action-title">' + meta.title + '</div>' +
                body +
                '<div class="ai-action-buttons">' +
                '<button class="ai-btn-sm ai-action-confirm" style="' + confirmStyle + '">' + escapeHtml(meta.confirm) + '</button>' +
                '<button class="ai-btn-sm ai-action-cancel">Скасувати</button>' +
                '</div>';

            msgsContainer.appendChild(card);
            msgsContainer.scrollTop = msgsContainer.scrollHeight;

            const confirmBtn = card.querySelector('.ai-action-confirm');
            const cancelBtn = card.querySelector('.ai-action-cancel');

            cancelBtn.onclick = function () {
                card.innerHTML = '<div style="color: var(--text-muted); font-size: 0.82rem;">' +
                    meta.title + ' — скасовано.</div>';
            };

            confirmBtn.onclick = function () {
                confirmBtn.disabled = true;
                cancelBtn.disabled = true;
                confirmBtn.innerText = 'Виконую...';

                google.script.run
                    .withSuccessHandler(function (result) {
                        card.innerHTML = '<div style="color: var(--status-done-text); font-size: 0.85rem;">✅ ' +
                            escapeHtml((result && result.message) || 'Готово.') + '</div>';
                        loadTasks();
                        if (action === 'createEvent') loadCalendarEvents();
                    })
                    .withFailureHandler(function (err) {
                        confirmBtn.disabled = false;
                        cancelBtn.disabled = false;
                        confirmBtn.innerText = meta.confirm;
                        addAiMsg('Не вдалося виконати дію: ' + (err.message || String(err)), 'bot');
                    })
                    .applyAiAction(action, data);
            };
        }

        function aiQuickAction(type) {
            let messageText = '';
            if (type === 'summary') messageText = '📊 Звіт дня';
            else if (type === 'prioritize') messageText = '🎯 Що робити далі?';

            addAiMsg(messageText, 'user');
            showAiTyping();

            const successHandler = responseText => {
                hideAiTyping();
                addAiMsg(responseText, 'bot');
                pushChatHistory(messageText, responseText);
            };

            const failureHandler = err => {
                hideAiTyping();
                addAiMsg('Не вдалося виконати дію: ' + (err.message || String(err)), 'bot');
            };

            if (type === 'summary') {
                google.script.run
                    .withSuccessHandler(successHandler)
                    .withFailureHandler(failureHandler)
                    .aiSummary('today');
            } else if (type === 'prioritize') {
                google.script.run
                    .withSuccessHandler(successHandler)
                    .withFailureHandler(failureHandler)
                    .aiPrioritize();
            }
        }

        function aiPrepMeeting(eventTitle, eventStart) {
            const panel = document.getElementById('aiChatPanel');
            if (!panel.classList.contains('active')) {

        function toggleStep(taskId, index, checkbox) {

            if (doneState) {

                textInput.style.color = 'var(--text-muted)';
            } else {
                textInput.style.textDecoration = 'none';
                textInput.style.color = 'var(--text-main)';
            }

            if (taskId && taskId !== 'null' && taskId !== 'undefined') {
                const task = allTasks.find(t => t.ID === taskId);
                if (!task) return;
                task.Кроки[index].done = doneState;
                modalSteps[index].done = doneState;

                google.script.run
                    .withSuccessHandler(() => {
                        updateDashboard();
                        filterTasks();
                    })
                    .withFailureHandler(err => {
                        alert('Помилка оновлення стану кроку: ' + err);
                        checkbox.checked = !checkbox.checked;
                        textInput.style.textDecoration = checkbox.checked ? 'line-through' : 'none';
                        textInput.style.color = checkbox.checked ? 'var(--text-muted)' : 'var(--text-main)';
                    })
                    .saveTaskSteps(taskId, task.Кроки);
            } else {
                modalSteps[index].done = doneState;
            }
        }

        function renderMd(text) {
            if (!text) return "";
            let lines = text.split('\n');
            let html = "";
            let inList = false;
            let listType = "";

            lines.forEach(line => {
                line = line.trim();
                if (!line) {
                    if (inList) {
                        html += `</${listType}>`;
                        inList = false;
                    }
                    html += "<br>";
                    return;
                }

                line = line.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

                if (line.startsWith('### ')) {
                    if (inList) { html += `</${listType}>`; inList = false; }
                    html += `<h3>${line.substring(4)}</h3>`;
                    return;
                }
                if (line.startsWith('## ')) {
                    if (inList) { html += `</${listType}>`; inList = false; }
                    html += `<h2>${line.substring(3)}</h2>`;
                    return;
                }
                if (line.startsWith('# ')) {
                    if (inList) { html += `</${listType}>`; inList = false; }
                    html += `<h1>${line.substring(2)}</h1>`;
                    return;
                }

                line = line.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

                if (line.startsWith('- ') || line.startsWith('* ')) {
                    if (!inList || listType !== 'ul') {
                        if (inList) html += `</${listType}>`;
                        html += '<ul>';
                        inList = true;
                        listType = 'ul';
                    }
                    html += `<li>${line.substring(2)}</li>`;
                    return;
                }

                const numMatch = line.match(/^(\d+)\.\s(.*)/);
                if (numMatch) {
                    if (!inList || listType !== 'ol') {
                        if (inList) html += `</${listType}>`;
                        html += '<ol>';
                        inList = true;
                        listType = 'ol';
                    }
                    html += `<li>${numMatch[2]}</li>`;
                    return;
                }

                if (inList) {
                    html += `</${listType}>`;
                    inList = false;
                }
                html += `<p>${line}</p>`;
            });

            if (inList) {
                html += `</${listType}>`;
            }

            return html;
        }

        function handleSelectedFile(file) {
            const errorDiv = document.getElementById('fileUploadError');
            errorDiv.style.display = 'none';

            // Check file type
            const ext = file.name.split('.').pop().toLowerCase();
            const allowed = ['pdf', 'doc', 'docx'];
            if (!allowed.includes(ext)) {
                errorDiv.innerText = 'Непідтримуваний формат файлу. Будь ласка, завантажте PDF або Word документ (.doc, .docx).';
                errorDiv.style.display = 'block';
                clearSelectedFile();
                return;
            }

            // Max size check: 15MB
            if (file.size > 15 * 1024 * 1024) {
                errorDiv.innerText = 'Файл занадто великий. Максимальний розмір — 15 MB.';
                errorDiv.style.display = 'block';
                clearSelectedFile();
                return;
            }

            selectedFile = file;

            // Render selected file details
            document.getElementById('selectedFileName').innerText = file.name;
            document.getElementById('selectedFileSize').innerText = formatBytes(file.size);
            document.getElementById('selectedFileSection').style.display = 'flex';

            // Enable button
            document.getElementById('btnProcessFile').disabled = false;
        }

        function clearSelectedFile() {
            selectedFile = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('selectedFileSection').style.display = 'none';
            document.getElementById('btnProcessFile').disabled = true;
            document.getElementById('fileUploadError').style.display = 'none';
            document.getElementById('fileUploadLoader').style.display = 'none';

            // Reset buttons
            document.getElementById('btnProcessFile').style.display = '';
            document.getElementById('btnCancelUpload').style.display = '';
        }

        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        function processFileWithAI() {
            if (!selectedFile) return;

            const loader = document.getElementById('fileUploadLoader');
            const loaderText = document.getElementById('fileUploadLoaderText');
            const errorDiv = document.getElementById('fileUploadError');
            const btnProcess = document.getElementById('btnProcessFile');
            const btnCancel = document.getElementById('btnCancelUpload');

            errorDiv.style.display = 'none';
            loader.style.display = 'flex';
            loaderText.innerText = 'Зчитування та кодування файлу...';

            // Disable actions during process
            btnProcess.disabled = true;
            btnCancel.disabled = true;

            const reader = new FileReader();
            reader.onload = function (e) {
                loaderText.innerText = 'Надсилання до ШІ та аналіз документу (це може зайняти до 15-30 сек)...';

                const dataUrl = e.target.result;
                const base64Data = dataUrl.split(',')[1];

                google.script.run
                    .withSuccessHandler(function (result) {
                        loader.style.display = 'none';
                        btnProcess.disabled = false;
                        btnCancel.disabled = false;

                        closeFileUploadModal();

                        // Open standard task creation modal
                        openModal(null);

                        // Populate with AI suggestions
                        if (result.Назва) {
                            document.getElementById('title').value = result.Назва;
                        }

                        let desc = '';
                        if (result['Замовник']) {
                            desc += 'Замовник / Відправник: ' + result['Замовник'] + '\n\n';
                        }
                        if (result['Опис']) {
                            desc += result['Опис'];
                        }
                        document.getElementById('description').value = desc;

                        if (result['Дедлайн']) {
                            document.getElementById('deadline').value = result['Дедлайн'];
                        }

                        if (result['Пріоритет']) {
                            document.getElementById('priority').value = result['Пріоритет'];
                        }

                        if (result['Тип']) {
                            document.getElementById('category').value = result['Тип'];
                        }

                        if (result['Кроки'] && result['Кроки'].length > 0) {
                            modalSteps = result['Кроки'];
                            renderModalSteps(modalSteps, null);
                        }
                    })
                    .withFailureHandler(function (err) {
                        loader.style.display = 'none';
                        btnProcess.disabled = false;
                        btnCancel.disabled = false;

                        errorDiv.innerText = 'Помилка аналізу файлу: ' + err;
                        errorDiv.style.display = 'block';
                    })
                    .aiCreateTaskFromDocument(base64Data, selectedFile.name, selectedFile.type || getMimeByExt(selectedFile.name));
            };

            reader.onerror = function () {
                loader.style.display = 'none';
                btnProcess.disabled = false;
                btnCancel.disabled = false;
                errorDiv.innerText = 'Помилка читання файлу на клієнті.';
                errorDiv.style.display = 'block';
            };

            reader.readAsDataURL(selectedFile);
        }

        function getMimeByExt(fileName) {
            const ext = fileName.split('.').pop().toLowerCase();
            if (ext === 'pdf') return 'application/pdf';
            if (ext === 'docx') return 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
            if (ext === 'doc') return 'application/msword';
            return 'application/octet-stream';
        }
